{v:'4.2',name:'Profil a nebe',items:['👤 **Můj profil**: na hlavní stránce si změníš ikonku, jméno i heslo.','📚 **Playlisty v JBfy**: ukládej si víc vlastních playlistů, přepínej mezi nimi a sdílej je do globálního chatu. Playlist z chatu si otevřeš jedním klepnutím.','😇 **Nebe a peklo**: tlačítkem na hlavní stránce přepneš ďábelské pozadí na andělské.','🔎 Vyhledávání na hlavní stránce teď používá Google přes SerpApi.','🌤️ Pod hledáním je počasí v Praze, dnešní datum a kdo má svátek.','🟢 Pod tím je počet hráčů online. Po klepnutí se ukáže jejich seznam.']},
{v:'4.1',name:'Portál',items:['🌐 **Hlavní stránka jako portál**: nahoře vyhledávání, pod ním zprávy ze světa, velké tlačítko Hrát a widgety JBfy, JB scrollu a Zpráv.','🔎 **Hledání**: přepínej mezi hledáním na internetu a chatem s Jirkou AI.','📰 **Co se děje ve světě**: pět aktuálních titulků, které se dají posouvat do stran. Klepnutí otevře původní web.','🎵 Widget **JBfy** ukazuje právě hraný disk a dá se z něj hudba ovládat.','📜 Widget **JB scroll** je scrollovací a má vypnutý zvuk, aby nerušil hudbu. Zvuk si zapneš tlačítkem 🔊.','✉️ Widget **Zprávy** ukazuje veřejný chat i soukromé zprávy.','🎧 V JBfy jdou nově nahrát i videa mp4 (použije se jen zvuk).']},
{v:'4.0',name:'Svět online JB zábavy',items:['🌐 **Nová hlavní stránka**: po otevření brány tě přivítá hub, odkud se dostaneš do hry, do JBfy, JB scrollu nebo do zpráv.','🎵 **JBfy**: hudba jako na Spotify. Každý může nahrát vlastní disk (track + obrázek), disky se řadí do playlistu, který hraje pořád dokola. Původní soundtrack „Přes cestu“ je tam hned.','🔊 Tlačítko hlasitosti ve hře má nově i rychlé ovládání JBfy a výběr disků.','📜 **JB scroll**: nahraj vlastní video nebo scrolluj videi ostatních. Lajkuj, komentuj a nevhodný obsah nahlas.','🏁 **Multiplayer – více kol**: král lobby nastaví počet kol. Jakmile první hráč dokončí závod, ostatní mají 10 s, pak začne další kolo. Na konci je celková tabulka.','🏠 Domeček a ⚙ jsou ve hře nově nad sebou, aby nepřekrývaly šipky.']},
{v:'3.3',name:'Eventový update',items:['📨 **Pozvánky do lobby**: v lobby klepni na „Pozvat online hráče“ a pošli pozvánku komukoliv, kdo je zrovna online. Pozvaný se připojí jedním klepnutím.','📌 **Nástěnka**: nová položka v menu. Admini tu vyhlašují eventy a online turnaje a ty se na ně můžeš přihlásit.','🐤 **Flappy JB**: nová minihra v menu. Jirka se svým skinem létá mezi překážkami. Za každé 2 splněné úrovně dostaneš 1 XP.']},
{v:'3.2',name:'Jirkův update',items:['🎭 **11 nových skinů**: Zachy, Šebesta, Vietnamec z Kavalírky, Jan Krejcar (super rare), Pepinka, Dafinka, Jarda Kraken, Jirka s dršťkovou polévkou (epic), Kebab guy z Kavalírky, Jirka s poděbradkou (mythic) a Octový Jirka (legendary).','🟢 **Kdo je online**: u profilovky hráče svítí zelené kolečko.','🕹️ **Joystick** teď jede plynule do všech směrů, i šikmo.','🛑 Demonstrace SPD se objeví **nejvýš jednou za úroveň** a jen na pruhu s auty, ne na checkpointech.','🤖 **Jirka AI**: klepni na hlavu Jirky vlevo dole v menu a chatuj s ním. Denně má každý hráč omezený počet zpráv.']},
{v:'3.1',name:'Octový update',items:['🧪 **Ocet**: nová měna. Koupíš ho za 50 coinů, dostaneš ho za výhru v denní výzvě (kdo dnes ujede nejdál) a za každý 5. level.','📅 **Denní výzva**: každý den soutěžíš, kdo ujede nejdál v Dojeď co nejdál. Vítěz dne dostane ocet.','🎰 **Rulety** v obchodu: padne jen skin dané rarity (rare 1, super rare 2, epic 3, mythic 5, legendary 7 octů).','🚀 **Balíčky startovních boostů**: 3 kusy za 75 coinů.','🪙 V Dojeď co nejdál dostaneš 1 coin za každé 2 pruhy.','🕹️ Ovládání lze přepnout na **joystick** (malé kolečko ve hře).','↔️ Obchod se posouvá do stran.','🍎 Opravena zpomalená hra na iPhonu v úsporném režimu.']},
{v:'3.0',name:'Redesign',items:['🎨 **Nový vzhled**: sjednocené barvy, tlačítka, karty, vstupní pole a okna v nočním pražském stylu. Rozložení menu i hry zůstalo stejné.','🧭 Ikony v menu jsou nově jednotné čárové místo emoji.','🚪 Přihlašovací brána a 🧩 Kavadle mají vyladěné ovládání; Kavadle dostalo stejné barvy jako hra.','♿ Viditelné zvýraznění při ovládání klávesnicí a podpora omezeného pohybu.']},
{v:'2.2',name:'Multiplayer',items:['🌐 **Multiplayer**: nový režim v Hrát! Vytvoř lobby, pošli kamarádům kód a závoďte spolu online. Král lobby nastaví počet pruhů a povolené boosty. Když tě srazí auto, vracíš se na začátek závodu.','🚋 **Zastávky místo úrovní**: v Dojeď co nejdál jedeš z Kavalírky tramvají č. 10 a od I. P. Pavlova metrem C až na Chodov. Za Chodovem pokračuješ jako Chodov I, II… Název zastávky vidíš i na chodnících (checkpointech).','✉️ Tlačítko Zprávy v menu je větší.']},
{v:'2.1',name:'Zprávy a leaderboardy',items:['🏆 **Leaderboards** jsou větší a vyšší v menu. Najdeš v nich světový žebříček Dojeď co nejdál i svoje osobní rekordy.','✉️ **Online** je nově **Zprávy**: chat a soukromé zprávy. Na své podněty a návrhy teď dostaneš odpověď přímo do zpráv.','🎭 Nové skiny v boxech.','😀 Hra má vlastní ikonku po přidání na plochu.']},
{v:'2.0',name:'Kavadle',items:['🧩 **Kavadle**: nová minihra s vlastními výsledky a možností začít novou hru.']},
{v:'1.1',name:'Levely',items:['📈 **Levely a XP**: za každý přejetý pruh v Dojeď co nejdál dostaneš 1 XP, za splněný level ve Story 50–100 XP. Svůj level vidíš v menu, ostatní hráči ho vidí u tvé profilovky.','🎁 Za každý 10. level (10, 20, 30…) dostaneš 50 🪙.','🎭 Další nové skiny v boxech.','📦 Startovní boosty z boxů padají po třech a Sezónní box má 60% šanci na sezónní věc.','🚌 Nový pomalý a velký autobus + opravy chyb (Story po prohře od checkpointu, hráč se už sám nehýbe).','📲 „Celá obrazovka“ je nově „Přidat na plochu“ s návodem.']},
{v:'1.0',name:'Musílkova',items:['🍂 **Sezóna 1 – Musílkova**: nová položka v menu se zamčenými sezónními skiny a pozadím.','🎁 **Sezónní box** (450 🪙): malá šance na sezónní skin nebo pozadí. Sezónní věci mají vlastní raritu „Sezónní“.','🏙 Sezónní pozadí vybereš v Upravit plochu → Sezónní pozadí.','🚀 **Startovní boosty** z boxů: 2 životy, imunita proti SPD, delší boosty. Aktivuješ je před startem Dojeď co nejdál.','🚇 **Metro** – vzácný boost v Dojeď co nejdál, posune tě o 10 polí.','⚠️ Upozornění před koncem boostu (blikání, text a pípnutí).','💰 Nové ceny boxů: Malý 175 · Velký 250 · Sezónní 450 🪙.','🔍 Klepnutím na skin ve „Vybrat skin“ ho zvětšíš.','💡 „Nahlásit bug“ je nově Podněty: bug, návrh změny nebo návrh skinu.','🔄 Nové pořadí tlačítek v menu.']}];

function mpEnter(st){if(!st){mpMsg('Nepodařilo se spojit se serverem.');return}MP=st;mpGh={};mpOff=st.now-Date.now();mpErr=0;mpSB=0;mpTk=0;clearInterval(MPT);MPT=setInterval(()=>{if(MP&&(MPUI=='race'||++mpTk%3==0))mpSync()},400);mpLobby()}

function mpGot(st){mpSB=0;if(!st){if(MP)mpDrop('Lobby už neexistuje.');return}mpErr=0;MP=st;mpOff=st.now-Date.now();const ids={};for(const q of st.players){if(q.id==st.me)continue;ids[q.id]=1;const g=mpGh[q.id]||(mpGh[q.id]={x:q.x*W,pg:q.prog});g.name=q.name;g.skin=q.skin;g.st=q.st;g.tx=q.x*W;g.tp=q.prog}for(const id in mpGh)if(!ids[id])delete mpGh[id];
 if(MPUI=='lobby'){if(st.status=='racing')mpBeginRace();else mpLobbyUpd()}

function mpLobby(){MPUI='lobby';over=false;mode='menu';BPF=id=>id!='revive';const k=MP.king==MP.me;
 show(`<h1>🌐 Lobby</h1><div class="cd" style="text-align:center"><span style="font-size:13px;opacity:.7">Kód lobby – pošli ho kamarádům</span><div onclick="mpCopy()" style="font-size:42px;font-weight:800;letter-spacing:8px;color:#ffd400;cursor:pointer">${esc(MP.code)}</div><span id="mpcp" style="font-size:12px;opacity:.6">klepnutím zkopíruješ</span></div><div class="cd"><b>👥 Hráči (<span id="mpn">1</span>/8)</b><div id="mpl" style="margin-top:6px"></div></div><div class="cd" id="mpsr" style="display:none"></div><div class="cd" id="mps"></div><div id="mpb" style="width:100%;display:flex;justify-content:center"></div>${k?'<button class="b y" id="mpgo" onclick="mpGo()">▶ Spustit závod</button>':'<p class="sub" id="mpw">Čeká se, až král lobby spustí závod…</p>'}<button class="b" style="--bc:#3ddc6b;--bx:#06220f" onclick="invOpen()">📨 Pozvat online hráče</button><div id="mpiv" style="width:100%;display:flex;justify-content:center"></div><p id="mpe" style="color:#ff9a9a;min-height:18px;margin:0"></p><button class="b s" onclick="mpLeave()">🚪 Opustit lobby</button>`,0,'mpLeave()');mpLobbyUpd()}

 Promise.all([AP('players').catch(()=>[]),AP('ping').catch(()=>null)]).then(([pl,on])=>{const e2=document.getElementById('mpiv');if(!e2||e2.dataset.o!='1'||!MP)return;setAv(pl);
  if(Array.isArray(on)){ONL.clear();on.forEach(u=>ONL.add(u));if(window.ACC_NAME)ONL.add(window.ACC_NAME)}

function invSend(i){const n=INVL[i];if(!n||!MP)return;const b=document.getElementById('inv'+i),m=document.getElementById('invm');if(b)b.disabled=true;
 AP('invsend',{to:n,code:MP.code}).then(()=>{INVS[n]=1;if(b)b.textContent='✓ Pozváno';if(m)m.textContent='';setTimeout(()=>{delete INVS[n];const q=document.getElementById('inv'+i);if(q&&q.textContent.indexOf('Pozváno')>=0){q.textContent='Pozvat';q.disabled=false}},20000)},e=>{if(b)b.disabled=false;if(m)m.textContent=INVE(String(e||''))})}
function invPoll(){if(document.hidden||!window.ACCAPI)return;AP('invpoll').then(l=>{(Array.isArray(l)?l:[]).forEach(invShow)},()=>{})}
function invShow(v){if(!v||!v.code)return;const old=document.getElementById('invb');if(old)old.remove();
 const e=document.createElement('div');e.id='invb';
 e.innerHTML=`<div class="it"><b>📨 ${esc(String(v.from||'?'))}</b> tě zve do lobby <b>${esc(String(v.code))}</b></div><div class="ia"><button class="b y" data-j="1">Připojit se</button><button class="b s" data-x="1">✕</button></div>`;
 const tmr=setTimeout(()=>e.remove(),60000);
 e.querySelector('[data-x]').onclick=()=>{clearTimeout(tmr);e.remove()};
 e.querySelector('[data-j]').onclick=()=>{if(mpBusy)return;if(MP){toast31('Už jsi v lobby.');return}if(FLO||mode!='menu'){toast31('Nejdřív dohraj, co děláš.');return}clearTimeout(tmr);e.remove();mpBusy=1;AP('mp_join',{code:String(v.code)}).then(r=>{mpBusy=0;mpEnter(r)},er=>{mpBusy=0;toast31(MPE(String(er||'')))})};
 document.getElementById('g').appendChild(e)}
setInterval(invPoll,7000);

// --- nastenka (eventy / online turnaje)
let EVL=[],EVN=0,EVMAX=0;
const evBadge=()=>EVN>0?' <span style="background:#e5383b;color:#fff;border-radius:10px;padding:1px 8px;font-size:14px">'+EVN+'</span>':'';
const evFmt=t=>{try{return new Date(t).toLocaleString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
function evCheck(){return AP('evlist').then(l=>{EVL=Array.isArray(l)?l:[];EVMAX=EVL.reduce((m,e)=>Math.max(m,+e.id||0),0);let seen=0;try{seen=+ACCLS.getItem('chev')||0}catch(e){}EVN=EVL.filter(e=>+e.id>seen).length;const b=document.getElementById('evb');if(b)b.innerHTML=evBadge();return EVL},()=>null)}
const evCard=e=>`<div class="cd" style="border:1px solid ${e.past?'rgba(255,255,255,.12)':'#c8a2ff'}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><b style="font-size:17px">🏆 ${esc(String(e.title||''))}</b>${window.ACC_ADMIN?`<span style="cursor:pointer;padding:0 4px" onclick="evDel(${+e.id})">🗑</span>`:''}</div>${e.starts_at?`<div style="color:#ffd400;font-weight:700;margin:4px 0">🕒 ${evFmt(e.starts_at)}${e.past?' · proběhlo':''}</div>`:''}<div style="font-size:14px;margin:6px 0;white-space:pre-wrap">${esc(String(e.body||''))}</div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:13px;opacity:.75">👥 přihlášeno: <b>${+e.n||0}</b></span>${e.past?'':`<button class="b ${e.joined?'s':''}" style="width:auto;padding:7px 14px;font-size:15px;margin:0" onclick="evJoin(${+e.id})">${e.joined?'✓ Přihlášen/a · odhlásit':'✋ Přihlásit se'}</button>`}</div></div>`;
function board(msg){mode='menu';over=false;show('<h1>📌 Nástěnka</h1><p class="sub">Načítám…</p>',0,'menu()');
 evCheck().then(l=>{if(!l){show('<h1>📌 Nástěnka</h1><p>Nepodařilo se načíst (běžel SQL 15-update-3-3.sql?).</p><button class="b" onclick="board()">↻ Zkusit znovu</button>',0,'menu()');return}
  try{ACCLS.setItem('chev',String(EVMAX))}catch(e){}EVN=0;
  show('<h1>📌 Nástěnka</h1><p class="sub">Eventy a online turnaje</p>'+(window.ACC_ADMIN?'<button class="b y" onclick="evForm()">➕ Vyhlásit event</button>':'')+(l.length?l.map(evCard).join(''):'<div class="cd" style="text-align:center;opacity:.8">Zatím tu žádný event není. Brzy se tu objeví první turnaj! 🏆</div>')+(msg?'<p class="sub">'+esc(msg)+'</p>':''),0,'menu()')})}
function evJoin(id){AP('evjoin',{id}).then(()=>board(),e=>board(/closed/.test(String(e))?'Přihlášky už jsou uzavřené.':'Nepovedlo se.'))}
function evDel(id){if(!window.ACC_ADMIN||!confirm('Smazat tento event?'))return;AP('evdel',{id}).then(()=>board('Event smazán.'),()=>board('Smazání se nepovedlo.'))}
function evForm(){show('<h1>➕ Nový event</h1><input id="evt" class="ip" maxlength="80" placeholder="Název (např. Turnaj Dojeď co nejdál)"><textarea id="evx" class="ta" rows="5" maxlength="600" placeholder="Popis, pravidla, odměny…" style="width:100%;max-width:clamp(310px,30vw,420px)"></textarea><div class="cd"><b>Kdy začíná (nepovinné)</b><input id="evd" class="ip" type="datetime-local" style="margin-top:6px"></div><button class="b y" onclick="evSave()">📌 Vyhlásit</button><p id="evm" style="color:#ff9a9a;min-height:18px;margin:0"></p>',0,'board()')}
function evSave(){const t=document.getElementById('evt').value.trim(),b=document.getElementById('evx').value.trim(),d=document.getElementById('evd').value,m=document.getElementById('evm');if(t.length<3){m.textContent='Napiš název eventu.';return}let st=null;if(d){const q=new Date(d);if(!isNaN(q))st=q.toISOString()}m.style.color='#fff';m.textContent='Ukládám…';AP('evnew',{title:t,body:b,starts:st}).then(()=>board('Event vyhlášen ✔'),()=>{m.style.color='#ff9a9a';m.textContent='Nepovedlo se (jsi admin? běžel SQL 15?).'})}
setTimeout(()=>{try{if(window.ACCAPI)evCheck()}catch(e){}},2500);

// --- minihra Flappy JB (1 XP za kazde 2 splnene urovne, 1 uroven = 5 prekazek)
let FLO=null;
function flapStop(){if(FLO){FLO();FLO=null}}
function flap(){mode='menu';over=false;flapStop();
 const g=document.getElementById('g'),o=document.createElement('div');o.id='fl';
 o.innerHTML='<button class="bk" id="flx" aria-label="Zpět">←</button><canvas id="flc"></canvas><div id="flr"></div>';
 g.appendChild(o);document.body.classList.add('indm');
 const cv=o.querySelector('#flc'),fc=cv.getContext('2d'),D=Math.min(2,window.devicePixelRatio||1),FLW=360,FLH=600,GND=72,BX=90,R=12,PW=56,PD=185,PL=5;
 cv.width=FLW*D;cv.height=FLH*D;fc.setTransform(D,0,0,D,0,0);
 const pnl=o.querySelector('#flr');
 const lvOf=n=>1+Math.floor(n/PL),spd=n=>Math.min(4.3,2.3+.17*(lvOf(n)-1)),gap=n=>Math.max(112,160-7*(lvOf(n)-1));
 let S,raf=0,last=0,tm=0,alive=true;
 const bld=[];{let q=7;for(let i=0;i<16;i++){q=(q*9301+49297)%233280;const w=34+q%30;q=(q*9301+49297)%233280;bld.push([w,50+q%110])}}
 const addPipe=px=>{const gp=gap(S.sc),lo=64+gp/2,hi=FLH-GND-64-gp/2;S.pipes.push({x:px,gy:lo+Math.random()*(hi-lo),gp,pass:0})};
 function init(){let b=0;try{b=+ACCLS.getItem('flbest')||0}catch(e){}S={st:0,y:FLH/2-40,vy:0,rot:0,pipes:[],sc:0,gx:0,fl:0,t:0,best:b};addPipe(FLW+90);while(S.pipes[S.pipes.length-1].x<FLW+PD)addPipe(S.pipes[S.pipes.length-1].x+PD);pnl.style.display='none';pnl.innerHTML=''}
 function jump(){if(S.st==2)return;if(S.st==0)S.st=1;S.vy=-6.6}
 function die(){if(S.st==2)return;S.st=2;S.vy=-3;if(S.sc>S.best){S.best=S.sc;try{ACCLS.setItem('flbest',String(S.best))}catch(e){}}tm=setTimeout(panel,700)}
 function panel(){if(!alive)return;const lv=Math.floor(S.sc/PL),xp=Math.floor(lv/2);
  pnl.style.display='flex';
  pnl.innerHTML='<div class="cd" style="text-align:center;max-width:300px"><h2 style="margin:0 0 6px">Konec letu</h2><p style="margin:4px 0">Překážky: <b>'+S.sc+'</b> · Splněné úrovně: <b>'+lv+'</b></p><p style="margin:4px 0;opacity:.8">Rekord: '+S.best+'</p><p id="flxp" style="margin:8px 0;font-weight:700;color:#ffd400">'+(xp>0?'Připisuju XP…':'Za 1 XP splň aspoň 2 úrovně (10 překážek).')+'</p><button class="b y" id="fl1">🔁 Znovu</button><button class="b s" id="fl2">← Menu</button></div>';
  pnl.querySelector('#fl1').onclick=()=>{init()};pnl.querySelector('#fl2').onclick=()=>{flapStop();menu()};
  if(xp>0)AP('flappy',{n:lv}).then(r=>{const b0=XP;stSet(r);const gain=Math.max(0,XP-b0),e=document.getElementById('flxp');if(e)e.textContent=gain>0?'+'+gain+' XP ✨':'Dnešní limit XP z Flappy JB je vyčerpaný.'},()=>{const e=document.getElementById('flxp');if(e){e.style.color='#ff9a9a';e.textContent='XP se nepodařilo připsat (běžel SQL 15-update-3-3.sql?).'}})}
 function upd(dt){
  if(S.st==0){S.t+=dt;S.y=FLH/2-40+Math.sin(S.t*.08)*7;S.rot=0;S.gx+=1.2*dt;return}
  if(S.st==1){S.vy=Math.min(9,S.vy+.38*dt);S.y+=S.vy*dt;S.rot=Math.max(-.45,Math.min(1.1,S.vy*.09));const v=spd(S.sc)*dt;S.gx+=v;for(const p of S.pipes)p.x-=v;
   if(S.pipes[0].x<-PW-10)S.pipes.shift();
   while(S.pipes[S.pipes.length-1].x<FLW+20)addPipe(S.pipes[S.pipes.length-1].x+PD);
   for(const p of S.pipes)if(!p.pass&&p.x+PW<BX-R){p.pass=1;S.sc++;if(S.sc%PL==0)S.fl=80}
   if(S.y<R){S.y=R;if(S.vy<0)S.vy=0}
   let hit=S.y+R>FLH-GND;for(const p of S.pipes)if(BX+R>p.x&&BX-R<p.x+PW&&(S.y-R<p.gy-p.gp/2||S.y+R>p.gy+p.gp/2))hit=true;
   if(hit)die();return}
  S.vy=Math.min(11,S.vy+.5*dt);if(S.y<FLH-GND-R){S.y+=S.vy*dt;S.rot=Math.min(1.5,S.rot+.12*dt)}else S.y=FLH-GND-R}
 function drw(){const c=fc;
  const gr=c.createLinearGradient(0,0,0,FLH);gr.addColorStop(0,'#0b1020');gr.addColorStop(.6,'#1f3562');gr.addColorStop(1,'#4a3560');c.fillStyle=gr;c.fillRect(0,0,FLW,FLH);
  c.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<24;i++){c.fillRect((i*97)%FLW,(i*53)%260,1.4,1.4)}
  const off=(S.gx*.3)%(16*50);c.fillStyle='#16203a';for(let k=0;k<2;k++)for(let i=0;i<16;i++){const bx=i*50-off+k*800-(k?0:0);const b=bld[i];c.fillRect(bx,FLH-GND-b[1],b[0],b[1])}
  c.fillStyle='#ffd16655';for(let k=0;k<2;k++)for(let i=0;i<16;i++){const bx=i*50-off+k*800,b=bld[i];for(let j=0;j<b[1]/22-1;j++)c.fillRect(bx+6,FLH-GND-b[1]+8+j*22,5,6)}
  for(const p of S.pipes){const top=p.gy-p.gp/2,bot=p.gy+p.gp/2;c.fillStyle='#3d9a8b';c.fillRect(p.x,0,PW,top);c.fillRect(p.x,bot,PW,FLH-GND-bot);c.fillStyle='#2b7468';c.fillRect(p.x,0,7,top);c.fillRect(p.x,bot,7,FLH-GND-bot);c.fillStyle='#57c2b0';c.fillRect(p.x+PW-9,0,5,top);c.fillRect(p.x+PW-9,bot,5,FLH-GND-bot);c.fillStyle='#2f857a';c.fillRect(p.x-4,top-18,PW+8,18);c.fillRect(p.x-4,bot,PW+8,18);c.fillStyle='#57c2b0';c.fillRect(p.x-4,top-18,PW+8,3);c.fillRect(p.x-4,bot,PW+8,3)}
  c.fillStyle='#2a2a33';c.fillRect(0,FLH-GND,FLW,GND);c.fillStyle='#ffd400';const dm=(S.gx*1)%40;for(let i=-1;i<10;i++)c.fillRect(i*40-dm,FLH-GND/2-2,22,4);c.fillStyle='#555';c.fillRect(0,FLH-GND,FLW,4);
  const o2=x,pv=PV;x=c;PV=null;c.save();c.translate(BX,S.y+8);c.rotate(S.rot);c.scale(.85,.85);chair(0,0,1,0);c.restore();x=o2;PV=pv;
  c.textAlign='center';c.lineJoin='round';c.font='800 46px system-ui,sans-serif';c.lineWidth=6;c.strokeStyle='#000';c.fillStyle='#fff';c.strokeText(S.sc,FLW/2,64);c.fillText(S.sc,FLW/2,64);
  c.font='700 15px system-ui,sans-serif';c.lineWidth=4;c.strokeText('Úroveň '+lvOf(S.sc),FLW/2,88);c.fillText('Úroveň '+lvOf(S.sc),FLW/2,88);
  if(S.st==0){c.font='700 18px system-ui,sans-serif';c.lineWidth=4;c.strokeText('Klepni nebo mezerník = skok',FLW/2,FLH/2+60);c.fillText('Klepni nebo mezerník = skok',FLW/2,FLH/2+60)}
  if(S.fl>0){c.globalAlpha=Math.min(1,S.fl/30);c.fillStyle='#ffd400';c.font='800 26px system-ui,sans-serif';c.lineWidth=5;c.strokeStyle='#000';const t='Úroveň '+(lvOf(S.sc)-1)+' splněna!';c.strokeText(t,FLW/2,150);c.fillText(t,FLW/2,150);c.globalAlpha=1}}
 function fitF(){const r=o.getBoundingClientRect(),s=Math.min(r.width/FLW,r.height/FLH);cv.style.width=Math.floor(FLW*s)+'px';cv.style.height=Math.floor(FLH*s)+'px'}
 function frame(ts){if(!alive)return;const dt=last?Math.min(2.2,(ts-last)/16.667):1;last=ts;if(S.fl>0)S.fl-=dt;upd(dt);drw();fitF();raf=requestAnimationFrame(frame)}
 const kd=e=>{if(e.code=='Space'||e.code=='ArrowUp'||e.code=='KeyW'){e.preventDefault();e.stopPropagation();if(pnl.style.display!='flex')jump()}};
 o.addEventListener('pointerdown',e=>{if(e.target.closest('button,.cd'))return;e.preventDefault();jump()});
 addEventListener('keydown',kd,true);
 o.querySelector('#flx').onclick=()=>{flapStop();menu()};
 FLO=()=>{alive=false;cancelAnimationFrame(raf);clearTimeout(tm);removeEventListener('keydown',kd,true);o.remove()};
 init();raf=requestAnimationFrame(frame)}

// ===== UPDATE 4.0: více kol v multiplayeru + JBfy v panelu zvuku =====
var serT0=0,serBusy=0,jbQ=0;
const mpRoundsOf=()=>Math.max(1,Math.min(10,+((MP&&MP.opts&&MP.opts.rounds)||1)));
function mpRdHtml(k){const R=mpRoundsOf(),w=R==1?'kolo':R<5?'kola':'kol';return k?`<div style="display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0"><button onclick="mpRd(-1)" style="${MPB}">−</button><b style="font-size:20px;min-width:110px;text-align:center">${R} ${w}</b><button onclick="mpRd(1)" style="${MPB}">+</button></div>`:`<p style="margin:8px 0">Počet kol: <b>${R}</b></p>`}
function mpRd(d){if(!MP||MP.king!=MP.me)return;const o=Object.assign({},MP.opts);o.rounds=Math.max(1,Math.min(10,mpRoundsOf()+d));mpSet(MP.lanes,o)}
function mpSerUi(){const e=document.getElementById('mpsr');if(!e||!MP)return;const o=MP.opts||{},R=+o.rounds||1,n=+o.rnd||0;if(!(R>1&&n>0)){e.style.display='none';return}
 const L=Object.values(o.sc||{}).sort((a,b)=>b[1]-a[1]);
 e.style.display='block';e.innerHTML='<b>'+(o.end?'🏆 Konec série ('+R+' kol)':'🏁 Série kol · kolo '+n+'/'+R)+'</b>'+(o.end?'':'<p style="margin:4px 0;opacity:.75;font-size:13px">Další kolo začne za okamžik…</p>')+(L.length?L.map((q,i)=>'<div style="display:flex;gap:8px;padding:4px 0;border-top:1px solid rgba(255,255,255,.08)"><span style="width:28px">'+(['🥇','🥈','🥉'][i]||(i+1)+'.')+'</span><span style="flex:1">'+esc(String(q[0]))+'</span><b>'+(+q[1])+' b.</b></div>').join(''):'')}
function mpResTxt(run){const o=(MP&&MP.opts)||{},R=+o.rounds||1,n=+o.rnd||0;
 if(R>1&&n>0&&!o.end){const base='Kolo '+n+'/'+R+' · ',last=n>=R;if(serT0){const s=Math.max(0,Math.ceil(((run?10000:3500)-(Date.now()-serT0))/1000));return base+(last?'celková tabulka za ':'další kolo za ')+s+' s'}return base+(run?'čekáme na ostatní hráče…':'závod skončil')}
 return run?'Čekáme na ostatní hráče…':'Závod skončil'}
// kruh série řídí král lobby: 10 s po prvním dokončení (nebo 3,5 s po dokončení všech) se přejde dál
function mpSer(st){if(!st)return;const o=st.opts||{},R=+o.rounds||1,n=+o.rnd||0;
 if(st.status!='racing'&&st.status!='results'){serT0=0;return}
 if(!(R>1&&n>0&&!o.end)){serT0=0;return}
 if(!serT0&&st.players.some(q=>q.st=='finished'))serT0=Date.now();
 if(st.king!=st.me||serBusy||!serT0)return;
 const all=st.status=='results'||st.players.every(q=>q.st=='finished'),dt=Date.now()-serT0;
 if(all?dt>=3500:dt>=10000)mpNextRound(st)}
function mpNextRound(st){serBusy=1;const o=Object.assign({},st.opts),R=+o.rounds,n=+o.rnd,N=st.players.length,
  fin=st.players.filter(q=>q.st=='finished').sort((a,b)=>a.fin-b.fin),sc=Object.assign({},o.sc||{});
 for(const q of st.players){const e=sc[q.id]||[q.name,0],i=fin.indexOf(q);sc[q.id]=[q.name,(+e[1]||0)+(i>=0?N-i:0)]}
 o.sc=sc;const last=n>=R;if(last)o.end=1;else o.rnd=n+1;
 AP('mp_back').then(()=>AP('mp_set',{lanes:st.lanes,opts:o})).then(r=>last?r:AP('mp_start')).then(r=>{serBusy=0;serT0=0;if(r)mpGot(r)},()=>{serBusy=0;serT0=0})}
// JBfy (hudba běží v rodičovské stránce)
function jbVolMsg(){if(jbQ)return;try{parent.postMessage({t:'jbvol',vol:vol,mut:mut},'*')}catch(e){}}
function jbCmd(c){try{parent.postMessage({t:'jbcmd',c:c},'*')}catch(e){}}
function jbOpenP(){try{parent.postMessage({t:'jbopen'},'*')}catch(e){}document.getElementById('sp').classList.remove('o')}
addEventListener('message',e=>{const d=e.data;if(!d||d.t!='jbnow')return;const t=document.getElementById('jbt');if(t)t.textContent=d.title?(d.title+(d.artist?' · '+d.artist:'')):'Nic nehraje';const p=document.getElementById('jbpp');if(p)p.textContent=d.playing?'⏸':'▶';
 if(typeof d.vol=='number'&&(Math.abs(d.vol-vol)>.005||(d.mut?1:0)!=mut)){vol=d.vol;mut=d.mut?1:0;sSave();jbQ=1;try{sApply()}finally{jbQ=0}}});
setTimeout(()=>{jbVolMsg();try{parent.postMessage({t:'jbask'},'*')}catch(e){}},300);

applyTh();reset();menu();if(needPatch())patch();loop();
