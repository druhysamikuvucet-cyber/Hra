<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hra</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hra"><meta name="theme-color" content="#050204">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050204;--blood:#c1121f;--dark:#5a0a0f;--fg:#ead7d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Cinzel,Georgia,serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 115%,#8a0c0c 0%,#34060a 38%,#0a0306 72%,#020102 100%)}
#bg::before,#bg::after{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 60%,rgba(120,10,15,.35),transparent 55%),radial-gradient(ellipse at 75% 40%,rgba(60,0,10,.5),transparent 50%);filter:blur(30px);animation:fog 14s ease-in-out infinite alternate}
#bg::after{animation-duration:19s;animation-direction:alternate-reverse;opacity:.7}
@keyframes fog{to{transform:translate(6%,-4%) scale(1.15)}}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000 120%)}
#em{position:fixed;inset:0;width:100%;height:100%}
#portal{position:relative;width:min(92vw,400px);aspect-ratio:1;transition:transform .9s ease-in,opacity .9s ease-in;filter:drop-shadow(0 0 28px rgba(193,18,31,.55))}
#portal.open{transform:scale(7);opacity:0}
#portal.shake{animation:sh .45s}
@keyframes sh{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.r1{transform-origin:200px 200px;animation:spin 60s linear infinite}
.r2{transform-origin:200px 200px;animation:spin 40s linear infinite reverse}
.pent{transform-origin:200px 200px;animation:pulse 3.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.25}}
#inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 17%;text-align:center}
h1{font:700 26px 'Cinzel Decorative',Cinzel,serif;margin:0;letter-spacing:3px;color:#ff3b3b;text-shadow:0 0 12px #c1121f,0 0 30px #7a0a0a}
#hint{font-size:11px;letter-spacing:2px;opacity:.75;margin:0}
#row{position:relative;width:100%}
input{width:100%;padding:11px 36px 11px 10px;font:500 16px Cinzel,Georgia,serif;letter-spacing:2px;text-align:center;color:var(--fg);background:rgba(8,0,2,.78);border:1px solid var(--blood);border-radius:8px;outline:0;box-shadow:inset 0 0 12px rgba(193,18,31,.35)}
input:focus{box-shadow:0 0 14px rgba(255,40,40,.6),inset 0 0 12px rgba(193,18,31,.5)}
#eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--fg);opacity:.7;font-size:16px;padding:6px}
#go{width:100%;padding:11px;font:700 13px Cinzel,Georgia,serif;letter-spacing:2px;color:#fff;background:linear-gradient(#a50f1a,#4a0509);border:1px solid #ff3b3b;border-radius:8px;box-shadow:0 0 14px rgba(193,18,31,.6)}
#go:active{transform:scale(.97)}
#msg{min-height:16px;margin:0;font-size:12px;color:#ff6b6b;letter-spacing:1px}
#game{position:fixed;inset:0;display:none;background:#000}
#game iframe{width:100%;height:100%;border:0;display:block}
#x,#adm{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:8px;z-index:5;width:32px;height:32px;border-radius:50%;border:1px solid #c1121f;background:rgba(0,0,0,.55);color:#fff;font-size:14px;padding:0}
#adm{left:46px;display:none}
#adm.dot::after{content:"";position:absolute;top:0;right:0;width:9px;height:9px;border-radius:50%;background:#e5383b}
#ap .tb .gb{letter-spacing:0;font-size:12px}
#mt{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(5,2,4,.97)}
#mt h2{font:700 24px 'Cinzel Decorative',Cinzel,serif;color:#ff3b3b;letter-spacing:3px;margin:0;text-shadow:0 0 14px #c1121f}
#mt p{max-width:340px;font-size:14px;line-height:1.5;margin:0}
#mt .sp{font-size:56px;animation:spin 4s linear infinite}
#mb{position:fixed;top:0;left:0;right:0;z-index:6;display:none;padding:3px 8px;font-size:11px;text-align:center;background:#a64f00;color:#fff;letter-spacing:1px}
#row{margin-top:0}
#ap{position:fixed;inset:0;z-index:9;display:none;overflow:auto;background:rgba(5,2,4,.96);padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 28px;text-align:center}
#ap h2{font:700 20px Cinzel,serif;letter-spacing:2px;color:#ff3b3b;margin:6px 0}
#ap .nt{font-size:12px;opacity:.75;margin:6px 0 12px}
#ap .tb{display:flex;gap:8px;max-width:420px;margin:6px auto}
#ap .tb .gb{margin:0;padding:8px}
#ap table{width:100%;max-width:560px;margin:10px auto;border-collapse:collapse;font-size:12px;text-align:left}
#ap th,#ap td{padding:6px 8px;border-bottom:1px solid #3a0a0f;vertical-align:top}
#ap th{color:#ff6b6b}
#ap .ac{display:flex;gap:8px;align-items:center;max-width:380px;margin:8px auto;padding:8px 10px;border:1px solid #5a0a0f;border-radius:8px;text-align:left}
#ap .ac b{flex:1;overflow:hidden;text-overflow:ellipsis}
#ap .ac span{font-size:11px;opacity:.7}
#ap .ac button{background:none;border:1px solid #5a0a0f;border-radius:6px;color:#fff;padding:4px 8px}
#ap input[type=text],#ap input:not([type]){max-width:380px;margin:8px auto;display:block}
#ap input[type=checkbox]{width:auto;display:inline;vertical-align:middle}
.gb{display:block;width:100%;max-width:380px;margin:10px auto;padding:11px;font:700 13px Cinzel,serif;letter-spacing:2px;color:#fff;background:linear-gradient(#a50f1a,#4a0509);border:1px solid #ff3b3b;border-radius:8px}
.gb.s{background:#2a0a0e;border-color:#5a0a0f}
.fm{min-height:16px;font-size:13px;color:#ff6b6b}
/* Lucifer: decorative guardian, isolated from the login controls. */
#lucifer{position:fixed;left:50%;top:50%;width:min(110vw,850px);height:min(110vw,850px);transform:translate(-50%,-61%);pointer-events:none;opacity:.92;filter:drop-shadow(0 0 24px #710b1c);}
#lucifer svg{position:static;width:100%;height:100%;overflow:visible}
#lucifer .demon-breath{transform-origin:400px 430px;animation:demonBreath 7s ease-in-out infinite}
#lucifer .demon-eyes{animation:demonEyes 4s ease-in-out infinite;filter:drop-shadow(0 0 5px #ff331f)}
#portal{isolation:isolate}
#inner{background:radial-gradient(ellipse,rgba(5,2,4,.75),transparent 70%)}
@keyframes demonBreath{50%{transform:translateY(-5px) scale(1.012)}}
@keyframes demonEyes{50%{opacity:.55}}
@media(max-width:600px){#lucifer{width:150vw;height:150vw;max-width:700px;max-height:700px;transform:translate(-50%,-66%);opacity:.85}}
@media(max-height:540px) and (min-width:601px){#lucifer{width:690px;height:690px;transform:translate(-50%,-55%)}}
@media(prefers-reduced-motion:reduce){#lucifer .demon-breath,#lucifer .demon-eyes{animation:none}}

#kv{position:fixed;inset:0;z-index:8;display:none;background:#fff}
#kv iframe{width:100%;height:100%;border:0;display:block}
#kvx{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:10;display:none;padding:8px 14px;border-radius:20px;border:1px solid #c1121f;background:rgba(0,0,0,.78);color:#fff;font:700 12px Cinzel,serif;letter-spacing:1px}

/* ===== UPDATE 3.0: brana - jemne vyladeni, identita zachovana ===== */
h1{font-variant-ligatures:none}
input{transition:box-shadow .2s,border-color .2s}
input:focus{border-color:#ff3b3b}
#go{transition:transform .12s,box-shadow .2s,filter .2s;cursor:pointer;box-shadow:0 0 14px rgba(193,18,31,.6),inset 0 1px 0 rgba(255,255,255,.18)}
@media (hover:hover){#go:hover{filter:brightness(1.15);box-shadow:0 0 22px rgba(255,40,40,.75),inset 0 1px 0 rgba(255,255,255,.22)}#eye:hover,#x:hover,#adm:hover{opacity:1}}
#go:focus-visible,#eye:focus-visible,#x:focus-visible,#adm:focus-visible{outline:2px solid #ffd400;outline-offset:2px}
#hint{opacity:.85}
#msg{font-weight:600}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}#portal{transition-duration:.01ms!important}}
/* ===== UPDATE 4.0: hub, zprávy, JB scroll ===== */
#hub{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 56px);overflow:auto;text-align:center}
body.hubon #lucifer{opacity:.38}
#hub h1{font-size:clamp(20px,5.6vw,32px);line-height:1.45;letter-spacing:2px;margin:0 0 20px;max-width:560px}
#hn{color:#fff;text-shadow:0 0 12px #ff3b3b,0 0 26px #c1121f}
.hbtn{position:relative;display:block;width:100%;max-width:400px;margin:9px auto;padding:17px 16px;font:700 19px Cinzel,Georgia,serif;letter-spacing:2px;color:#fff;background:linear-gradient(#a50f1a,#4a0509);border:1px solid #ff3b3b;border-radius:12px;box-shadow:0 0 18px rgba(193,18,31,.55),inset 0 1px 0 rgba(255,255,255,.18);cursor:pointer;transition:transform .12s,filter .2s}
.hbtn small{display:block;margin-top:5px;font:500 11px Cinzel,Georgia,serif;letter-spacing:1px;opacity:.8}
.hbtn:active{transform:scale(.97)}
@media(hover:hover){.hbtn:hover{filter:brightness(1.2)}}
.hbtn.p{font-size:24px;padding:22px 16px;background:linear-gradient(#d4161f,#6a060b)}
.hbtn.ld{opacity:.6;pointer-events:none}
.hbtn i{position:absolute;top:8px;right:10px;min-width:20px;padding:1px 6px;border-radius:10px;background:#ffd400;color:#1a0508;font:800 12px system-ui,sans-serif;font-style:normal;display:none}
#hb,#hx,#hadm{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5;width:32px;height:32px;border-radius:50%;border:1px solid #c1121f;background:rgba(0,0,0,.55);color:#fff;font-size:14px;padding:0;cursor:pointer}
#hx{left:8px}#hadm{left:46px;display:none}
#x,#hb,#adm{left:6px;width:30px;height:30px;font-size:13px}
#x{bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}#hb{bottom:calc(env(safe-area-inset-bottom,0px) + 44px)}#adm{bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
#hadm.dot::after{content:"";position:absolute;top:0;right:0;width:9px;height:9px;border-radius:50%;background:#e5383b}
#ap .tb{flex-wrap:wrap;justify-content:center}
#ms,#sc{position:fixed;inset:0;z-index:7;display:none;flex-direction:column;background:rgba(5,2,4,.97);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
#ms .nt,#sc .nt{font-size:13px;opacity:.75;margin:6px 0 12px}
.mbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;border-bottom:1px solid #5a0a0f;max-width:560px;width:100%;margin:0 auto}
.mbar b{flex:1;font:700 17px Cinzel,serif;letter-spacing:2px;color:#ff6b6b;text-align:left}
.rb{width:38px;height:38px;border-radius:50%;border:1px solid #c1121f;background:rgba(0,0,0,.6);color:#fff;font-size:17px;padding:0;cursor:pointer;flex:none}
#msb{flex:1;overflow:auto;padding:12px;max-width:560px;width:100%;margin:0 auto}
.mrow{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #3a0a0f;border-radius:10px;margin:8px 0;background:rgba(40,6,10,.5);cursor:pointer;text-align:left}
.mrow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow small{opacity:.65;display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.dotb{min-width:20px;padding:1px 6px;border-radius:10px;background:#ffd400;color:#1a0508;font:800 12px system-ui,sans-serif;text-align:center}
.av{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#7a1620;color:#fff;font-weight:700;flex:none}
.ml{display:flex;flex-direction:column;gap:6px}
.bub{max-width:85%;align-self:flex-start;padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.1);text-align:left;word-break:break-word;font-size:15px}
.bub.me{align-self:flex-end;background:rgba(193,18,31,.45)}
.bub small{display:block;opacity:.55;font-size:11px;margin-top:2px}
.mi{display:flex;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 10px);max-width:560px;width:100%;margin:0 auto}
#ms input,#sc input{flex:1;width:auto;min-width:0;padding:11px 12px;letter-spacing:0;text-align:left;font:500 15px system-ui,sans-serif}
.mi button{border:0;border-radius:10px;background:#c1121f;color:#fff;font-size:18px;padding:0 16px;cursor:pointer}
/* JB scroll */
#scf{position:absolute;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
#scf::-webkit-scrollbar{display:none}
#sct{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 22px;background:linear-gradient(rgba(0,0,0,.8),transparent);pointer-events:none}
#sct>*{pointer-events:auto}
#sct b{font:700 18px 'Cinzel Decorative',Cinzel,serif;letter-spacing:2px;color:#ff3b3b;text-shadow:0 0 10px #c1121f}
#sct .up{border:1px solid #ff3b3b;background:linear-gradient(#a50f1a,#4a0509);color:#fff;border-radius:19px;padding:0 14px;height:38px;font:700 13px system-ui,sans-serif;cursor:pointer}
.vi{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
.vi video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.vp{position:absolute;inset:0;margin:auto;width:70px;height:70px;border-radius:50%;background:rgba(0,0,0,.55);display:none;place-items:center;font-size:30px;pointer-events:none}
.vr{position:absolute;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);display:flex;flex-direction:column;gap:12px;align-items:center;z-index:2}
.vr button{width:48px;border:0;background:rgba(0,0,0,.45);color:#fff;border-radius:24px;padding:8px 0 5px;font-size:22px;line-height:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.vr button b{font:700 11px system-ui,sans-serif}
.vr button.on{color:#ff3b5c;background:rgba(193,18,31,.35)}
.vm{position:absolute;left:0;right:70px;bottom:0;padding:40px 14px calc(env(safe-area-inset-bottom,0px) + 22px);background:linear-gradient(transparent,rgba(0,0,0,.8));text-align:left;pointer-events:none}
.vm b{font-size:15px}.vm p{margin:4px 0 0;font-size:14px;word-break:break-word}
.vm .hid{color:#ffd400;font-size:12px}
#sce{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:30px;color:#ddd}
#scx{position:absolute;inset:0;z-index:5;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sh{width:100%;max-width:480px;max-height:80%;overflow:auto;background:#12040a;border:1px solid #5a0a0f;border-radius:16px 16px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);text-align:left}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.shh b{font:700 16px Cinzel,serif;letter-spacing:1px;color:#ff6b6b}
.shh button{border:0;background:none;color:#fff;font-size:20px;cursor:pointer}
.cm{padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px;word-break:break-word}
.cm span{opacity:.5;font-size:11px;margin-left:6px}.cm i{font-style:normal;cursor:pointer;margin-left:8px;opacity:.8}
.sh .gb{margin:6px 0}
.sh input[type=file]{width:100%;font-size:14px;padding:10px;margin-bottom:8px}
.pb{height:8px;background:#2a0a0e;border-radius:4px;overflow:hidden;margin:8px 0;display:none}.pb i{display:block;height:100%;width:0;background:#ff3b3b}
/* ===== JBfy ===== */
#jb{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;background:rgba(5,2,4,.98);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
#jb .jbw{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;max-width:600px;margin:0 auto}
#jb.gm{background:rgba(0,0,0,.45);justify-content:flex-end}
#jb.gm .jbw{flex:none;height:74%;background:#0b0306;border:1px solid #5a0a0f;border-radius:18px 18px 0 0;overflow:hidden}
#jb .nt{font-size:13px;opacity:.75;margin:6px 0 12px}
.jbt{display:flex;gap:8px;padding:0 12px 8px}
.jbt button{flex:1;border:1px solid #5a0a0f;background:rgba(40,6,10,.6);color:#fff;border-radius:10px;padding:9px 6px;font:600 14px system-ui,sans-serif;cursor:pointer}
.jbt button.on{background:linear-gradient(#a50f1a,#4a0509);border-color:#ff3b3b}
#jbb{flex:1;min-height:0;overflow:auto;padding:4px 12px 12px}
.jbg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:520px){.jbg{grid-template-columns:repeat(3,1fr)}}
.jc{background:rgba(40,6,10,.5);border:1px solid #3a0a0f;border-radius:14px;padding:10px;text-align:center;min-width:0}
.jc b{display:block;margin-top:8px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc small{display:block;opacity:.65;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jcd{position:relative;cursor:pointer;width:86%;margin:0 auto}
.jcd .pp{position:absolute;inset:0;margin:auto;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:16px;opacity:0;transition:opacity .15s}
.jcd:hover .pp,.jcd:active .pp{opacity:1}
.jcb{display:flex;gap:6px;margin-top:8px;justify-content:center;flex-wrap:wrap}
.jcb button{border:1px solid #5a0a0f;background:rgba(0,0,0,.4);color:#fff;border-radius:8px;padding:5px 8px;font-size:12px;cursor:pointer}
.jcb button.on{background:#c1121f;border-color:#ff3b3b}
.dk{position:relative;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#2a2a2a 0,#070707 70%);box-shadow:0 0 0 2px #000,0 4px 14px rgba(0,0,0,.6)}
.dk::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.07) 0 1px,transparent 1px 4px);pointer-events:none}
.dk img{position:absolute;inset:17%;width:66%;height:66%;border-radius:50%;object-fit:cover}
.dk i{position:absolute;left:50%;top:50%;width:11%;height:11%;transform:translate(-50%,-50%);border-radius:50%;background:#05020a;border:2px solid #444;z-index:1}
.dk.sp{animation:dks 6s linear infinite}
@keyframes dks{to{transform:rotate(360deg)}}
.jr{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #3a0a0f;border-radius:10px;margin:7px 0;background:rgba(40,6,10,.5)}
.jr .dk{width:44px;flex:none}
.jr .ti{flex:1;min-width:0;text-align:left;cursor:pointer}
.jr .ti b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr .ti small{opacity:.65;font-size:12px}
.jr button{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer}
#jbp{border-top:1px solid #5a0a0f;background:#12040a;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px)}
.jbn{display:flex;align-items:center;gap:10px}
.jbn .dk{width:42px;flex:none}
.jbn .ti{flex:1;min-width:0;text-align:left}
.jbn .ti b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jbn .ti small{opacity:.65;font-size:12px}
.jbc{display:flex;gap:6px}
.jbc button{border:0;background:rgba(255,255,255,.12);color:#fff;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer}
.jbc button.pp{background:#c1121f}
.jbpr{height:6px;background:#2a0a0e;border-radius:3px;margin:8px 0 4px;cursor:pointer;overflow:hidden}

function vidDur(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),v=document.createElement('video');const done=(ok,x)=>{clearTimeout(t);URL.revokeObjectURL(u);ok?res(x):rej(x)};const t=setTimeout(()=>done(false,'timeout'),8000);v.preload='metadata';v.onloadedmetadata=()=>done(true,v.duration);v.onerror=()=>done(false,'err');v.src=u})}
function xhrUp(path,f,mime,prog){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST',SB+'/storage/v1/object/jbscroll/'+path.split('/').map(encodeURIComponent).join('/'));x.setRequestHeader('apikey',KEY);x.setRequestHeader('Authorization','Bearer '+ses.access_token);x.setRequestHeader('Content-Type',mime);x.setRequestHeader('x-upsert','false');x.setRequestHeader('cache-control','max-age=3600');
 x.upload.onprogress=e=>{if(e.lengthComputable)prog(Math.round(e.loaded/e.total*100))};x.onload=()=>{if(x.status>=200&&x.status<300)res();else{let m='';try{m=JSON.parse(x.responseText).message||''}catch(e){}rej(new Error(m||('HTTP '+x.status)))}};x.onerror=()=>rej(new Error('síť'));x.send(f)})}

 let ext=VEXT[f.type]||(String(f.name).toLowerCase().match(/\.(mp4|mov|webm)$/)||[])[1];if(!ext){m.textContent='Podporované formáty: mp4, mov, webm.';return}
 if(f.size>25*1024*1024){m.textContent='Video má víc než 25 MB. Natoč kratší nebo v nižší kvalitě.';return}
 go.disabled=true;m.style.color='#ffb3b3';m.textContent='Kontroluju video…';
 let dur;try{dur=await vidDur(f)}catch(e){m.style.color='#ff6b6b';m.textContent='Video se nepodařilo přečíst. Zkus mp4.';go.disabled=false;return}
 if(!(dur>0)||dur>60.5){m.style.color='#ff6b6b';m.textContent=dur>60.5?'Video je delší než 60 s.':'Video se nepodařilo přečíst.';go.disabled=false;return}
 const path=me.id+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.'+ext;
 try{await refresh()}catch(e){}
 $('scpb').style.display='block';m.textContent='Nahrávám…';
 try{await xhrUp(path,f,VMIME[ext],p=>{const b=$('scpb');if(b)b.firstChild.style.width=p+'%'})}catch(e){m.style.color='#ff6b6b';m.textContent='Nahrání se nepovedlo ('+emsg(e)+').';go.disabled=false;return}
 try{await XA('vreg',{path,caption:($('scap').value||'').trim(),dur})}catch(e){stDel(path);m.style.color='#ff6b6b';m.textContent=VERR(emsg(e));go.disabled=false;return}
 scShut();const f2=$('scf');if(f2){f2.innerHTML='';f2.scrollTop=0}SCL=0;SCEnd=false;scMore(true)}

 const gen=()=>{let h=0;for(const ch of title)h=(h*31+ch.charCodeAt(0))%360;const g=x2.createLinearGradient(0,0,S,S);g.addColorStop(0,'hsl('+h+',70%,45%)');g.addColorStop(1,'hsl('+((h+60)%360)+',70%,15%)');x2.fillStyle=g;x2.fillRect(0,0,S,S);x2.fillStyle='rgba(255,255,255,.9)';x2.font='700 220px Georgia,serif';x2.textAlign='center';x2.textBaseline='middle';x2.fillText((title[0]||'♪').toUpperCase(),S/2,S/2+10);fin()};

 '<h3>Změnit jméno</h3><input id="pfn" maxlength="20" placeholder="Nové jméno (a–z, 0–9, _ . -)" autocomplete="off"><input id="pfc1" type="password" placeholder="Aktuální heslo" autocomplete="current-password"><button class="gb" onclick="pfRen()">Uložit jméno</button>'+
 '<h3>Změnit heslo</h3><input id="pfp" type="password" placeholder="Nové heslo (aspoň 6 znaků)" autocomplete="new-password"><input id="pfp2" type="password" placeholder="Nové heslo znovu" autocomplete="new-password"><input id="pfc2" type="password" placeholder="Aktuální heslo" autocomplete="current-password"><button class="gb" onclick="pfPass()">Uložit heslo</button><p id="pfm" class="fm" style="text-align:center"></p></div></div>';
 m.style.display='flex';$('pff').onchange=e=>pfAv(e.target.files[0])}

function pfAv(f){if(!f)return;pfMsg('Zpracovávám…',1);const r=new FileReader();r.onerror=()=>pfMsg('Obrázek se nepodařilo načíst.');r.onload=()=>{const im=new Image();im.onerror=()=>pfMsg('Tohle není obrázek.');im.onload=async()=>{
 const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,128,128);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);
 let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>55000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}
 try{await XA('setavatar',{d});HAV=d;const a=$('pfav');if(a)a.innerHTML=avh(HAV,me.name,84);pfMsg('Ikonka uložena.',1)}catch(e){pfMsg('Uložení ikonky se nepovedlo.')}};im.src=r.result};r.readAsDataURL(f)}

async function pfRen(){const n=$('pfn').value.trim().toLowerCase(),c=$('pfc1').value;if(!/^[a-z0-9_.-]{3,20}$/.test(n))return pfMsg('Jméno: 3 až 20 znaků, jen a–z, 0–9, _ . -');if(!c)return pfMsg('Zadej aktuální heslo.');pfMsg('Ukládám…',1);
 try{const r=await profFn({a:'rename',name:n,current:c});me.name=r.name||n;$('hn').textContent=me.name;hubPfPaint();$('pfc1').value='';$('pfn').value='';pfMsg('Jméno změněno. Příště se přihlas novým jménem.',1)}catch(e){pfMsg(String(e.message||'Změna se nepovedla.'))}}
async function pfPass(){const p=$('pfp').value,q=$('pfp2').value,c=$('pfc2').value;if(p.length<6)return pfMsg('Heslo musí mít aspoň 6 znaků.');if(p!=q)return pfMsg('Hesla se neshodují.');if(!c)return pfMsg('Zadej aktuální heslo.');pfMsg('Ukládám…',1);
 try{await profFn({a:'password',password:p,current:c});for(const i of['pfp','pfp2','pfc2'])$(i).value='';pfMsg('Heslo změněno.',1)}catch(e){pfMsg(String(e.message||'Změna se nepovedla.'))}}

async function jbPlSave(){const n=$('jbpn').value.trim(),m=$('jbm');if(!n){m.textContent=JVERR('bad_name');return}m.style.color='#fff';m.textContent='Ukládám…';

function hubInfo(){const el=$('hi1');if(!el)return;
 const pr=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Prague'}).split('-').map(Number);
 let day=new Date().toLocaleDateString('cs-CZ',{timeZone:'Europe/Prague',weekday:'long',day:'numeric',month:'long'});day=day.charAt(0).toUpperCase()+day.slice(1);
 const nm=(ND[pr[1]-1]||'').split('|')[pr[2]-1]||'';let sv='';
 if(nm){if(nm[0]=='*')sv='🎉 '+nm.slice(1);else{const L=nm.split('/');sv='🎉 Svátek '+(L.length>1||/ a /.test(nm)?'mají ':'má ')+L.join(', ')}}
 const draw=w=>{el.innerHTML=(w?'<span>'+w[0]+' Praha '+(+w[2])+' °C'+(w[1]?', '+esc(w[1]):'')+'</span> · ':'')+'<span>📅 '+esc(day)+'</span>'+(sv?' · <span>'+esc(sv)+'</span>':'')};
 let w=null;try{const c=JSON.parse(sessionStorage.getItem('hwx')||'null');if(c&&Date.now()-c.t<9e5)w=c.w}catch(e){}
 draw(w);if(w)return;
 fetch('https://api.open-meteo.com/v1/forecast?latitude=50.0755&longitude=14.4378&current=temperature_2m,weather_code&timezone=Europe%2FPrague').then(r=>r.json()).then(j=>{const c=j&&j.current;if(!c||c.temperature_2m==null)return;const m=WMO(+c.weather_code);w=[m[0],m[1],Math.round(+c.temperature_2m)];try{sessionStorage.setItem('hwx',JSON.stringify({t:Date.now(),w}))}catch(e){}draw(w)}).catch(()=>{})}

// žhavé uhlíky
const cv=$('em'),g=cv.getContext('2d');let w,h,P=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rs(){const d=Math.min(2,devicePixelRatio||1);w=cv.width=innerWidth*d;h=cv.height=innerHeight*d}
function mk(i){return{x:Math.random()*w,y:i?Math.random()*h:h+10,r:(1+Math.random()*2.5)*(w/700+.6),v:.3+Math.random()*1.1,s:Math.random()*6,a:.3+Math.random()*.6}}
rs();addEventListener('resize',rs);for(let i=0;i<(reduce?25:70);i++)P.push(mk(1));
function tick(){g.clearRect(0,0,w,h);g.globalCompositeOperation='lighter';
 for(const p of P){p.y-=p.v;p.s+=.02;p.x+=Math.sin(p.s)*.5;if(p.y<-10)Object.assign(p,mk(0));
  const t=Math.max(0,p.y/h);g.fillStyle=`rgba(255,${Math.floor(60+90*(1-t))},20,${p.a*(.4+.6*t)})`;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}
 if(!reduce)requestAnimationFrame(tick)}
tick();
