<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hra</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hra"><meta name="theme-color" content="#050204">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050204;--blood:#c1121f;--dark:#5a0a0f;--fg:#ead7d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Cinzel,Georgia,serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 115%,#8a0c0c 0%,#34060a 38%,#0a0306 72%,#020102 100%)}
#bg::before,#bg::after{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 60%,rgba(120,10,15,.35),transparent 55%),radial-gradient(ellipse at 75% 40%,rgba(60,0,10,.5),transparent 50%);filter:blur(30px);animation:fog 14s ease-in-out infinite alternate}
#bg::after{animation-duration:19s;animation-direction:alternate-reverse;opacity:.7}
@keyframes fog{to{transform:translate(6%,-4%) scale(1.15)}}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000 120%)}
#em{position:fixed;inset:0;width:100%;height:100%}
#portal{position:relative;width:min(92vw,400px);aspect-ratio:1;transition:transform .9s ease-in,opacity .9s ease-in;filter:drop-shadow(0 0 28px rgba(193,18,31,.55))}
#portal.open{transform:scale(7);opacity:0}
#portal.shake{animation:sh .45s}
@keyframes sh{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.r1{transform-origin:200px 200px;animation:spin 60s linear infinite}
.r2{transform-origin:200px 200px;animation:spin 40s linear infinite reverse}
.pent{transform-origin:200px 200px;animation:pulse 3.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.25}}
#inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 17%;text-align:center}
h1{font:700 26px 'Cinzel Decorative',Cinzel,serif;margin:0;letter-spacing:3px;color:#ff3b3b;text-shadow:0 0 12px #c1121f,0 0 30px #7a0a0a}
#hint{font-size:11px;letter-spacing:2px;opacity:.75;margin:0}
#row{position:relative;width:100%}
input{width:100%;padding:11px 36px 11px 10px;font:500 16px Cinzel,Georgia,serif;letter-spacing:2px;text-align:center;color:var(--fg);background:rgba(8,0,2,.78);border:1px solid var(--blood);border-radius:8px;outline:0;box-shadow:inset 0 0 12px rgba(193,18,31,.35)}
input:focus{box-shadow:0 0 14px rgba(255,40,40,.6),inset 0 0 12px rgba(193,18,31,.5)}
#eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--fg);opacity:.7;font-size:16px;padding:6px}
#go{width:100%;padding:11px;font:700 13px Cinzel,Georgia,serif;letter-spacing:2px;color:#fff;background:linear-gradient(#a50f1a,#4a0509);border:1px solid #ff3b3b;border-radius:8px;box-shadow:0 0 14px rgba(193,18,31,.6)}
#go:active{transform:scale(.97)}
#msg{min-height:16px;margin:0;font-size:12px;color:#ff6b6b;letter-spacing:1px}
#game{position:fixed;inset:0;display:none;background:#000}
#game iframe{width:100%;height:100%;border:0;display:block}
#x,#adm{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:8px;z-index:5;width:32px;height:32px;border-radius:50%;border:1px solid #c1121f;background:rgba(0,0,0,.55);color:#fff;font-size:14px;padding:0}
#adm{left:46px;display:none}
#row{margin-top:0}
#ap{position:fixed;inset:0;z-index:9;display:none;overflow:auto;background:rgba(5,2,4,.96);padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 28px;text-align:center}
#ap h2{font:700 20px Cinzel,serif;letter-spacing:2px;color:#ff3b3b;margin:6px 0}
#ap .nt{font-size:12px;opacity:.75;margin:6px 0 12px}
#ap .tb{display:flex;gap:8px;max-width:420px;margin:6px auto}
#ap .tb .gb{margin:0;padding:8px}
#ap table{width:100%;max-width:560px;margin:10px auto;border-collapse:collapse;font-size:12px;text-align:left}
#ap th,#ap td{padding:6px 8px;border-bottom:1px solid #3a0a0f;vertical-align:top}
#ap th{color:#ff6b6b}
#ap .ac{display:flex;gap:8px;align-items:center;max-width:380px;margin:8px auto;padding:8px 10px;border:1px solid #5a0a0f;border-radius:8px;text-align:left}
#ap .ac b{flex:1;overflow:hidden;text-overflow:ellipsis}
#ap .ac span{font-size:11px;opacity:.7}
#ap .ac button{background:none;border:1px solid #5a0a0f;border-radius:6px;color:#fff;padding:4px 8px}
#ap input[type=text],#ap input:not([type]){max-width:380px;margin:8px auto;display:block}
#ap input[type=checkbox]{width:auto;display:inline;vertical-align:middle}
.gb{display:block;width:100%;max-width:380px;margin:10px auto;padding:11px;font:700 13px Cinzel,serif;letter-spacing:2px;color:#fff;background:linear-gradient(#a50f1a,#4a0509);border:1px solid #ff3b3b;border-radius:8px}
.gb.s{background:#2a0a0e;border-color:#5a0a0f}
.fm{min-height:16px;font-size:13px;color:#ff6b6b}
</style></head><body>
<div id="bg"></div><canvas id="em"></canvas><div id="vig"></div>
<div id="portal">
<svg viewBox="0 0 400 400" aria-hidden="true">
<defs><path id="cp" d="M200,200 m-178,0 a178,178 0 1,1 356,0 a178,178 0 1,1 -356,0"/><radialGradient id="gl"><stop offset="55%" stop-color="#000" stop-opacity=".85"/><stop offset="100%" stop-color="#7a0a0a" stop-opacity=".25"/></radialGradient></defs>
<circle cx="200" cy="200" r="196" fill="url(#gl)"/>
<g class="r1"><circle cx="200" cy="200" r="194" fill="none" stroke="#7a0b0b" stroke-width="2" stroke-dasharray="3 9"/><text font-size="17" fill="#c1121f" letter-spacing="9"><textPath href="#cp">ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ</textPath></text></g>
<circle cx="200" cy="200" r="166" fill="none" stroke="#c1121f" stroke-width="2"/>
<g class="r2"><circle cx="200" cy="200" r="158" fill="none" stroke="#7a0b0b" stroke-width="1.5" stroke-dasharray="14 6 2 6"/></g>
<g class="pent"><polygon points="200,50 57.3,153.7 111.8,321.4 288.2,321.4 342.7,153.7" fill="none" stroke="#c1121f" stroke-width="2" opacity=".55"/><circle cx="200" cy="200" r="150" fill="none" stroke="#c1121f" stroke-width="1.5" opacity=".55"/></g>
</svg>
<div id="inner">
<h1>BRÁNA</h1>
<p id="hint">PŘIHLAS SE</p>
<input id="user" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Jméno" aria-label="Jméno" style="padding-right:10px">
<div id="row"><input id="code" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Heslo" placeholder="Heslo"><button id="eye" type="button" aria-label="Zobrazit kód">👁</button></div>
<button id="go" type="button">OTEVŘÍT PORTÁL</button>
<p id="msg"></p>
</div></div>
<div id="game"><button id="x" aria-label="Odhlásit">✕</button><button id="adm" aria-label="Admin">⚙</button></div><div id="ap"></div>
<script>
const SB='https://gwkhtvgnwewtdmxiufoe.supabase.co',KEY='sb_publishable_9R7PdfrUK3ivnLgzDXYqiQ_71oaITPl',DOM='@chodov-hra.app';
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let ses=null,me=null,busy=false,saveT=0,pend=null,delI=-1,ACC=[];
const store=()=>{try{ses?localStorage.setItem('chs',ses.refresh_token):localStorage.removeItem('chs')}catch(e){}};
async function auth(body,q){const r=await fetch(SB+'/auth/v1/token?grant_type='+q,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw j;ses=j;store();return j}
const refresh=()=>auth({refresh_token:ses.refresh_token},'refresh_token');
async function api(path,opt={}){const go=()=>fetch(SB+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+ses.access_token,'Content-Type':'application/json',...(opt.headers||{})}});let r=await go();if(r.status==401){await refresh();r=await go()}if(!r.ok){let e={};try{e=await r.json()}catch(_){}throw e}return r.json().catch(()=>null)}
async function fn(b){await refresh();const r=await fetch(SB+'/functions/v1/admin-users',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+ses.access_token,'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Chyba serveru ('+r.status+')');return j}
const setBlock=(h,id,v)=>h.replace(new RegExp('(<script type="application/json" id="'+id+'">)[\\s\\S]*?(<\/script>)'),(m,p,q)=>p+v+q);
const pre=(d,a)=>'<script id="accpre">window.ACC_ADMIN='+(a?1:0)+';window.ACCD='+JSON.stringify(d).replace(/</g,'\\u003c')+';(function(){var s=function(){parent.postMessage({t:"save",d:ACCD},"*")};window.ACCLS={getItem:function(k){return k in ACCD?ACCD[k]:null},setItem:function(k,v){ACCD[k]=String(v);s()},removeItem:function(k){delete ACCD[k];s()}};window.ACCAPI=function(o,a){return new Promise(function(res,rej){var id=String(Math.random());var f=function(e){if(e.data&&e.data.id==id){removeEventListener("message",f);e.data.ok?res(e.data.data):rej()}};addEventListener("message",f);parent.postMessage({t:"api",id:id,op:o,arg:a},"*")})};window.claude={use:async function(n){return n=="artifact"&&ACC_ADMIN?{publish:function(h){return new Promise(function(res,rej){var id=String(Math.random());var f=function(e){if(e.data&&e.data.id==id){removeEventListener("message",f);e.data.ok?res():rej({code:"err"})}};addEventListener("message",f);parent.postMessage({t:"pub",id:id,h:h},"*")})}}:null}}})();<\/script>';
function fail(t){const m=$('msg');m.style.color='#ff6b6b';m.textContent=t||'Brána zůstává zavřená…';const p=$('portal');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');busy=false}
async function enter(){
 const uid=ses.user.id;
 const [pr,pg,cf,gm]=await Promise.all([api('/rest/v1/profiles?id=eq.'+uid+'&select=username,is_admin'),api('/rest/v1/progress?user_id=eq.'+uid+'&select=data'),api('/rest/v1/config?select=key,value'),fetch('game.html').then(r=>{if(!r.ok)throw 0;return r.text()})]);
 me={id:uid,name:pr[0].username,admin:!!pr[0].is_admin};
 let html=gm;for(const c of cf||[])if(c.key=='credata'||c.key=='devdata')html=setBlock(html,c.key,c.value);
 html=html.replace('<head>','<head>'+pre((pg&&pg[0]&&pg[0].data)||{},me.admin));
 $('portal').classList.add('open');
 setTimeout(()=>{$('portal').style.display='none';const f=document.createElement('iframe');f.srcdoc=html;$('game').appendChild(f);$('game').style.display='block';$('adm').style.display=me.admin?'block':'none'},850)}
async function login(){const u=$('user').value.trim().toLowerCase(),p=$('code').value;if(busy||!u||!p)return;busy=true;const m=$('msg');m.style.color='#ff9a9a';m.textContent='Probouzím portál…';
 try{await auth({email:u+DOM,password:p},'password')}catch(e){return fail()}
 try{await enter()}catch(e){fail('Hru se nepodařilo načíst.')}}
async function flush(){if(!pend||!ses)return;const d=pend;pend=null;let done={};try{done=JSON.parse(d.chdone||'{}')}catch(e){}
 try{await api('/rest/v1/progress?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:me.id,data:d,best:+d.chbest||0,done,updated_at:new Date().toISOString()})})}catch(e){pend=pend||d}}
async function pubCfg(h){if(!me||!me.admin)throw 0;const rows=[];for(const id of['credata','devdata']){const m=h.match(new RegExp('<script type="application/json" id="'+id+'">([\\s\\S]*?)<\/script>'));if(m)rows.push({key:id,value:m[1],updated_at:new Date().toISOString()})}
 if(rows.length)await api('/rest/v1/config?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)})}
async function onApi(d){const a=d.arg||{};
 if(d.op=='lb')return api('/rest/v1/rpc/get_leaderboard',{method:'POST',body:'{}'});
 if(d.op=='chat'){const r=await api('/rest/v1/messages?select=id,body,created_at,profiles(username)&order=id.desc&limit=50'+(a.after?'&id=gt.'+(+a.after||0):''));return r.reverse().map(m=>({id:m.id,u:m.profiles?m.profiles.username:'?',b:m.body,t:m.created_at}))}
 if(d.op=='send'){const b=String(a.body||'').trim().slice(0,300);if(!b)throw 0;await api('/rest/v1/messages',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:me.id,body:b})});return 1}
 throw 0}
addEventListener('message',e=>{const f=document.querySelector('#game iframe'),d=e.data;if(!d||!f||e.source!==f.contentWindow)return;
 if(d.t=='save'){pend=d.d;clearTimeout(saveT);saveT=setTimeout(flush,1500)}
 else if(d.t=='api')onApi(d).then(x=>e.source.postMessage({id:d.id,ok:1,data:x},'*'),()=>e.source.postMessage({id:d.id,ok:0},'*'))
 else if(d.t=='pub')pubCfg(d.h).then(()=>e.source.postMessage({id:d.id,ok:1},'*'),()=>e.source.postMessage({id:d.id,ok:0},'*'))});
addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
$('x').addEventListener('click',async()=>{try{await flush()}catch(e){}ses=null;store();location.reload()});
// ---- admin panel
const ap=$('ap'),DN=['easy','medium','hard','demon'],NM={easy:'Easy',medium:'Medium',hard:'Hard',demon:'Démon'};
const tabs=t=>'<div class="tb"><button class="gb'+(t=='lb'?'':' s')+'" data-t="lb">🏆 Leaderboard</button><button class="gb'+(t=='ac'?'':' s')+'" data-t="ac">👥 Účty</button></div>';
async function lb(){ap.style.display='block';ap.innerHTML='<h2>Admin</h2>'+tabs('lb')+'<p class="nt">Načítám…</p>';
 try{const r=await api('/rest/v1/progress?select=best,done,updated_at,profiles(username,is_admin)&order=best.desc');
  ap.innerHTML='<h2>Admin</h2>'+tabs('lb')+'<table><tr><th>Účet</th><th>🏃 Rekord</th><th>📖 Story</th><th>Naposledy</th></tr>'+r.map(x=>'<tr><td>'+esc(x.profiles.username)+(x.profiles.is_admin?' ★':'')+'</td><td>'+x.best+'</td><td>'+DN.map(d=>NM[d]+' '+(x.done&&x.done[d]?'✅'+'❤'.repeat(x.done[d]):'⬜')).join('<br>')+'</td><td>'+(x.updated_at?new Date(x.updated_at).toLocaleString('cs-CZ',{dateStyle:'short',timeStyle:'short'}):'')+'</td></tr>').join('')+'</table><button class="gb s" data-cl="1">Zavřít</button>'}
 catch(e){ap.innerHTML='<h2>Admin</h2>'+tabs('lb')+'<p class="fm">Načtení se nepovedlo.</p><button class="gb s" data-cl="1">Zavřít</button>'}}
async function ac(msg){delI=-1;ap.style.display='block';
 try{ACC=await api('/rest/v1/profiles?select=id,username,is_admin&order=username')}catch(e){ap.innerHTML='<p class="fm">Načtení se nepovedlo.</p><button class="gb s" data-cl="1">Zavřít</button>';return}
 ap.innerHTML='<h2>Admin</h2>'+tabs('ac')+ACC.map((a,i)=>'<div class="ac"><b>'+esc(a.username)+'</b><span>'+(a.is_admin?'ADMIN':'hráč')+(a.id==me.id?' · ty':'')+'</span><button data-e="'+i+'">✏️</button><button data-d="'+i+'">🗑</button></div>').join('')+'<button class="gb" data-add="1">＋ Přidat účet</button><button class="gb s" data-cl="1">Zavřít</button><p id="fm" class="fm">'+(msg||'')+'</p>'}
function form(i){const a=i==null?{username:'',is_admin:false}:ACC[i];ap.innerHTML='<h2>'+(i==null?'Nový účet':'Upravit účet')+'</h2><input id="fn" placeholder="Jméno (a–z, 0–9, . _ -)" value="'+esc(a.username)+'" maxlength="20" autocapitalize="off"><input id="fp" type="text" autocomplete="off" placeholder="'+(i==null?'Heslo (min. 6 znaků)':'Nové heslo (prázdné = beze změny)')+'"><label class="nt"><input id="fr" type="checkbox"'+(a.is_admin?' checked':'')+'> Admin</label><button class="gb" data-sv="'+(i==null?'':i)+'">💾 Uložit</button><button class="gb s" data-ls="1">Zpět</button><p id="fm" class="fm"></p>'}
async function save(i){const n=$('fn').value.trim().toLowerCase(),p=$('fp').value,r=$('fr').checked,m=$('fm');
 if(!/^[a-z0-9._-]{1,20}$/.test(n))return void(m.textContent='Jméno: 1–20 znaků a–z, 0–9, . _ -');
 if(i==null&&p.length<6)return void(m.textContent='Heslo musí mít aspoň 6 znaků.');
 m.style.color='#ffb3b3';m.textContent='Ukládám…';
 try{i==null?await fn({a:'create',username:n,password:p,is_admin:r}):await fn({a:'update',id:ACC[i].id,username:n,password:p||undefined,is_admin:r});ac('Uloženo ✔')}catch(e){m.style.color='#ff6b6b';m.textContent=e.message}}
async function del(i){const m=$('fm');m.style.color='#ffb3b3';m.textContent='Mažu…';try{await fn({a:'delete',id:ACC[i].id});ac('Smazáno ✔')}catch(e){m.style.color='#ff6b6b';m.textContent=e.message}}
ap.onclick=e=>{const d=e.target.dataset;if(!d)return;
 if(d.cl)ap.style.display='none';else if(d.t)d.t=='lb'?lb():ac();else if(d.add)form(null);else if(d.ls)ac();else if(d.sv!=null)save(d.sv===''?null:+d.sv);
 else if(d.e!=null&&d.e!=='')form(+d.e);
 else if(d.d!=null&&d.d!==''){if(delI==+d.d)del(+d.d);else{delI=+d.d;e.target.textContent='Opravdu?'}}}
$('adm').addEventListener('click',lb);
$('go').addEventListener('click',login);
for(const i of['user','code'])$(i).addEventListener('keydown',e=>{if(e.key=='Enter')login()});
$('eye').addEventListener('click',()=>{const c=$('code');c.type=c.type=='password'?'text':'password'});
(async()=>{let t=null;try{t=localStorage.getItem('chs')}catch(e){}if(!t)return;busy=true;$('msg').textContent='Probouzím portál…';try{ses={refresh_token:t};await refresh();await enter()}catch(e){ses=null;store();$('msg').textContent='';busy=false}})();
// žhavé uhlíky
const cv=$('em'),g=cv.getContext('2d');let w,h,P=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rs(){const d=Math.min(2,devicePixelRatio||1);w=cv.width=innerWidth*d;h=cv.height=innerHeight*d}
function mk(i){return{x:Math.random()*w,y:i?Math.random()*h:h+10,r:(1+Math.random()*2.5)*(w/700+.6),v:.3+Math.random()*1.1,s:Math.random()*6,a:.3+Math.random()*.6}}
rs();addEventListener('resize',rs);for(let i=0;i<(reduce?25:70);i++)P.push(mk(1));
function tick(){g.clearRect(0,0,w,h);g.globalCompositeOperation='lighter';
 for(const p of P){p.y-=p.v;p.s+=.02;p.x+=Math.sin(p.s)*.5;if(p.y<-10)Object.assign(p,mk(0));
  const t=Math.max(0,p.y/h);g.fillStyle=`rgba(255,${Math.floor(60+90*(1-t))},20,${p.a*(.4+.6*t)})`;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}
 if(!reduce)requestAnimationFrame(tick)}
tick();
</script></body></html>
