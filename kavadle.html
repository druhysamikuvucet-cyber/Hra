<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kavadle</title>
<style>
:root{--bg:#fff;--fg:#121213;--bd:#d3d6da;--bd2:#878a8c;--mute:#787c7e;--ok:#6aaa64;--key:#d3d6da;--tile:#fff;--modal:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121213;--fg:#fff;--bd:#3a3a3c;--bd2:#565758;--mute:#818384;--ok:#538d4e;--key:#818384;--tile:#121213;--modal:#121213;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121213;--fg:#fff;--bd:#3a3a3c;--bd2:#565758;--mute:#818384;--ok:#538d4e;--key:#818384;--tile:#121213;--modal:#121213;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.35 "Clear Sans","Helvetica Neue",Arial,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:env(safe-area-inset-top,0px) 12px 0}
.bar{max-width:500px;margin:0 auto;height:50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
h1{margin:0;font:700 clamp(24px,6vw,32px)/1 "Karnak","Georgia","Times New Roman",serif;letter-spacing:.01em;text-align:center}
.ic{display:flex;justify-content:flex-end;gap:2px}
.ib{background:none;border:0;padding:6px;color:var(--fg);cursor:pointer;display:grid;place-items:center;border-radius:4px;box-shadow:none;margin:0}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:focus-visible,input:focus-visible,.close:focus-visible,.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
main{max-width:500px;margin:0 auto;padding:14px 12px 40px}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.key{background:var(--key);color:#000;border-radius:4px;padding:7px 4px;text-align:center;min-height:50px;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:background .3s}
:root[data-theme="dark"] .key,.dk .key{color:#fff}
.key b{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.key span{font-size:12px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.key.on{background:var(--ok);color:#fff}
.search{margin-bottom:6px}
input{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--fg)}
input:focus{outline:none;border-color:var(--bd2)}
#list{list-style:none;margin:6px 0 0;padding:0;max-height:210px;overflow-y:auto;border:1px solid var(--bd);border-radius:4px}
#list li{padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer;font-weight:600}
#list li:last-child{border:0}
#list li:hover,#list li:focus,#list li.sel{background:var(--bd);outline:none}
#list li.empty{color:var(--mute);cursor:default;background:none;font-weight:400}
.cnt{color:var(--mute);font-size:13px}
.cntline{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--bd);transition:background .3s,box-shadow .3s}
.dots i.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.who{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:12px}
.who .ph{width:84px;height:84px;border-radius:50%;border:2px dashed var(--bd2);display:grid;place-items:center;color:var(--bd2);overflow:hidden;background:var(--tile)}
.who .ph svg{width:54px;height:54px;fill:currentColor}
.who .ph img{width:100%;height:100%;object-fit:cover}
.who .cap{font-weight:700;font-size:14px}
.who.done .ph{border-style:solid;border-color:var(--ok);color:var(--ok)}
.avs{width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;overflow:hidden;flex:none;opacity:.75}
.avs svg{width:18px;height:18px;fill:currentColor}
.avs img{width:100%;height:100%;object-fit:cover}
.heads,.row{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:5px}
.heads{margin-bottom:4px;color:var(--mute);font-size:10px;font-weight:700;text-transform:uppercase;text-align:center;letter-spacing:.03em}
.row{margin-bottom:5px}
.t{min-height:80px;border:2px solid var(--bd);background:var(--tile);color:var(--fg);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-weight:700;font-size:12px;line-height:1.15;text-transform:uppercase;overflow-wrap:anywhere;hyphens:auto}
.t.ph{border-color:var(--bd)}
.t.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.t.nm{font-size:11px;flex-direction:column;gap:4px}
.row.fresh .t{animation:flip .6s ease both;animation-delay:calc(var(--i)*.25s)}
.row.fresh .t.ok{animation-name:flipok}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
@keyframes flipok{0%{transform:rotateX(0);background:var(--tile);border-color:var(--bd);color:var(--fg)}49%{transform:rotateX(-90deg);background:var(--tile);border-color:var(--bd);color:var(--fg)}50%{transform:rotateX(-90deg);background:var(--ok);border-color:var(--ok);color:#fff}100%{transform:rotateX(0);background:var(--ok);border-color:var(--ok);color:#fff}}
.row.bounce .t{animation:bounce .9s ease both;animation-delay:calc(var(--i)*.1s + 1.5s)}
@keyframes bounce{0%,20%{transform:translateY(0)}40%{transform:translateY(-24px)}50%{transform:translateY(5px)}60%{transform:translateY(-12px)}80%{transform:translateY(2px)}100%{transform:translateY(0)}}
.row.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.row .t{animation:none!important}}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);font-weight:700;padding:12px 16px;border-radius:4px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(255,255,255,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 12px 12px}
:root[data-theme="dark"] .ov,.dk .ov{background:rgba(0,0,0,.5)}
.modal{position:relative;background:var(--modal);border:1px solid var(--bd);border-radius:8px;box-shadow:0 4px 23px rgba(0,0,0,.2);max-width:500px;width:100%;max-height:100%;overflow-y:auto;padding:20px 24px 24px}
.modal h2{font:800 16px "Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;text-align:center;margin:0 0 14px}
.modal h3{font:700 14px "Helvetica Neue",Arial,sans-serif;text-transform:uppercase;margin:16px 0 8px}
.modal p{margin:8px 0;font-size:14px}
.close{position:absolute;top:12px;right:12px;background:none;border:0;cursor:pointer;color:var(--fg);padding:4px;display:grid}
.close svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.ex{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:4px;margin:8px 0}
.ex .t{min-height:44px;font-size:9px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-bottom:6px}
.stats b{display:block;font-size:30px;font-weight:400;line-height:1.1}
.stats span{font-size:11px;line-height:1.1;display:block}
.fin{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:16px;border-top:1px solid var(--bd);padding-top:16px}
.fin>div{text-align:center}
.fin h3{margin:0 0 4px}
.clock{font-size:30px;font-weight:400;letter-spacing:.02em}
.btn{background:var(--ok);color:#fff;border:0;border-radius:4px;font:700 18px "Helvetica Neue",Arial,sans-serif;text-transform:uppercase;padding:0 22px;height:52px;cursor:pointer;margin:0}
.btn:active{filter:brightness(.92)}
.hidden{display:none!important}
.modelbl{text-align:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--tile);color:var(--fg);padding:12px 14px;margin:0 0 8px;border-radius:6px}
.opt b{display:block;font-size:16px}
.opt span{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.opt.on{border-color:var(--ok)}
.opt.on b::after{content:" ✓";color:var(--ok)}
.edrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}
.edph{position:relative;flex:none;width:46px;height:46px;border-radius:50%;border:2px dashed var(--bd2);background:var(--tile);color:var(--bd2);padding:0;margin:0;cursor:pointer;overflow:hidden;display:grid;place-items:center}
.edph svg{width:28px;height:28px;fill:currentColor}
.edph img{width:100%;height:100%;object-fit:cover}
.edrm{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:var(--tile);color:var(--fg);cursor:pointer;font-size:16px;line-height:1;padding:0;margin:0}
.edin{flex:1;min-width:0;padding:9px 10px;font-weight:600}
.lbl{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:10px 0 4px}
.err{color:#c9372c;font-weight:700;min-height:20px;margin:8px 0 0}
textarea{width:100%;min-height:120px;font:12px/1.3 monospace;padding:10px;border:2px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--fg)}
.opt:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
@media (max-width:420px){.t{min-height:76px;font-size:10.5px;padding:3px}.t.nm{font-size:10px}.heads{font-size:9px}}

/* ===== UPDATE 3.0: Kavadle - nocni prazsky styl jako hra, rozlozeni beze zmeny ===== */
:root{--ac:#ffd400;--bg:#f4f1ea;--fg:#1b1e29;--bd:#d9d4c6;--bd2:#8a8574;--mute:#6f6a5c;--ok:#2e9e4f;--key:#e6e1d3;--tile:#fffdf8;--modal:#fffdf8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--fg:#f2f4fa;--bd:rgba(255,255,255,.16);--bd2:#8a94b8;--mute:#97a1c0;--ok:#2fa84f;--key:#1d2a4a;--tile:#111a33;--modal:#14213a}}
:root[data-theme="dark"]{--bg:#0b1020;--fg:#f2f4fa;--bd:rgba(255,255,255,.16);--bd2:#8a94b8;--mute:#97a1c0;--ok:#2fa84f;--key:#1d2a4a;--tile:#111a33;--modal:#14213a}
body{font-family:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{background:radial-gradient(120% 60% at 50% 0,color-mix(in srgb,var(--bg) 82%,#2b4a7a) 0,var(--bg) 60%) fixed,var(--bg)}
header{border-bottom:2px solid var(--ac);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
h1{font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.01em}
.ib{border-radius:10px;transition:background .15s,transform .1s}
.ib:hover{background:var(--bd)}.ib:active{transform:scale(.92)}
.key{border-radius:10px;border:1px solid var(--bd);transition:background .25s,transform .15s}
.key.on{box-shadow:0 0 0 1px rgba(0,0,0,.15),0 4px 12px rgba(0,0,0,.2)}
input{border-radius:12px;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,212,0,.28)}
#list{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#list li{transition:background .12s}
.btn{border-radius:12px;font-weight:700;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.modal{border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);border:1px solid var(--bd)}
.ib:focus-visible,input:focus-visible,.close:focus-visible,.btn:focus-visible,#list li:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header><div class="bar">
  <div><button class="ib" id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div><h1>Kavadle</h1>
  <div class="ic">
    <button class="ib" id="bHelp" aria-label="Jak hrát"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4.5M12 17.8h.01"/></svg></button>
    <button class="ib" id="bStats" aria-label="Statistiky"><svg viewBox="0 0 24 24"><path d="M6 20V11M12 20V4M18 20v-6"/></svg></button>
    <button class="ib" id="bTheme" aria-label="Přepnout vzhled"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</div></header>

<main>
  <div class="modelbl" id="modeLbl"></div>
  <div class="who" id="who"><div class="ph" id="whoPh"></div><div class="cap" id="whoCap"></div></div>
  <div class="keys" id="keys"></div>

    <div class="search"><input id="q" type="search" placeholder="Hledej jméno a vyber ze seznamu" autocomplete="off" aria-label="Hledat osobu"></div>

</main>
<div id="toast"></div>
<div class="ov hidden" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"><button class="close" id="bClose" aria-label="Zavřít"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button><div id="mbody"></div></div></div>

<script>
const DATA=[["Mgr. Josef Růžička", "Muž", "Ostatní", "vedení školy+ spe", "Učitel"], ["Mgr. Jarmila Hlináková", "Žena", "Blond", "vedení školy+ spe", "Učitel"], ["PhDr. Jan Novák", "Muž", "Černá", "vedení školy+ spe", "Učitel"], ["PhDr. Andrea Alon", "Žena", "Černá", "Cizí jazyky", "Učitel"], ["Bc. Mariia Bakhareva", "Žena", "Blond", "Cizí jazyky", "Učitel"], ["Mgr. Lenka Bergerová", "Žena", "Černá", "Mat a Fyz", "Učitel"], ["Mgr. Iveta Bušková", "Žena", "Blond", "Cizí jazyky", "Učitel"], ["Mgr. Barbora Bejvlová", "Žena", "Blond", "Čj", "Učitel"], ["Mgr. Klára Cerovská", "Žena", "Hnědá", "Mat a Fyz", "Učitel"], ["Mgr. Fialová Silva", "Žena", "Hnědá", "Cizí jazyky", "Učitel"], ["Filip Zoula", "Muž", "Hnědá", "Ict", "Učitel"], ["Mgr. Jana Haškovcová", "Žena", "Černá", "Cizí jazyky", "Učitel"], ["RNDr. Martina Hynková", "Žena", "Hnědá", "Ict", "Učitel"], ["Mgr. Ondřej Jobek", "Muž", "Hnědá", "Tv", "Učitel"], ["Mgr. Jana Janská", "Žena", "Blond", "Cizí jazyky", "Učitel"], ["RNDr. Marie Kindermannová", "Žena", "Ostatní", "Chem + Bio", "Učitel"], ["Mgr. Lenka Klingerová", "Žena", "Hnědá", "Čj", "Učitel"], ["Štěpán Kovář", "Muž", "Hnědá", "Ict", "Učitel"], ["Mgr. Zdeněk Kříž", "Muž", "Ostatní", "Zemepis", "Učitel"], ["Mgr. Jitka Kudláčková", "Žena", "Černá", "Chem + Bio", "Učitel"], ["Mgr. Zuzana Lomíčková", "Žena", "Ostatní", "Cizí jazyky", "Učitel"], ["Mgr. Eva Matějková", "Žena", "Černá", "Čj", "Učitel"], ["Mgr. Tereza Maňásková", "Žena", "Černá", "Zemepis", "Učitel"], ["Mgr. Lucie Matoušková", "Žena", "Ostatní", "Estetika", "Učitel"], ["Mgr. Eva Marxová", "Žena", "Hnědá", "Chem + Bio", "Učitel"], ["Mgr. Renáta Mrázová", "Žena", "Hnědá", "Tv", "Učitel"], ["Mgr. Tomáš Nosek", "Muž", "Hnědá", "Tv", "Učitel"], ["Ing. Alena Perušičová", "Žena", "Černá", "Mat a Fyz", "Učitel"], ["Mgr. Jitka Procházková", "Žena", "Blond", "Zemepis", "Učitel"], ["Mgr. Saskia Polomská", "Žena", "Černá", "Mat a Fyz", "Učitel"], ["Ing. Anna Praská", "Žena", "Hnědá", "Chem + Bio", "Učitel"], ["Mgr. Monika Rampasová", "Žena", "Hnědá", "vedení školy+ spe", "Učitel"], ["Mgr. Lukáš Ruml", "Muž", "Hnědá", "Čj", "Učitel"], ["Mgr. Vojtěch Ripl", "Muž", "Černá", "Cizí jazyky", "Učitel"], ["PhDr. Ramon Salgueiro", "Muž", "Ostatní", "Cizí jazyky", "Učitel"], ["PaedDr. Martina Semorádová", "Žena", "Černá", "Mat a Fyz", "Učitel"], ["Mgr. Libor Sládek", "Muž", "Hnědá", "Estetika", "Učitel"], ["Mgr. Alena Smlsalová", "Žena", "Černá", "Cizí jazyky", "Učitel"], ["Jakub Srnka", "Muž", "Hnědá", "Ict", "Učitel"], ["RNDr. Dana Šimánková", "Žena", "Blond", "Mat a Fyz", "Učitel"], ["PhDr. Jaroslava Šťastná", "Žena", "Blond", "Cizí jazyky", "Učitel"], ["Mgr. Hedvika Tvrdá", "Žena", "Hnědá", "Estetika", "Učitel"], ["Mgr. Dana Tomanová", "Žena", "Černá", "Cizí jazyky", "Učitel"], ["Ing. Jana Vašková", "Žena", "Blond", "Mat a Fyz", "Učitel"], ["M. A. Eva Vlčková", "Žena", "Ostatní", "Estetika", "Učitel"], ["Mgr. Veronika Vyskočilová", "Žena", "Černá", "Estetika", "Učitel"], ["Mgr. Blanka Zahálková", "Žena", "Ostatní", "Čj", "Učitel"], ["Míra Školník", "Muž", "Ostatní", "Žádný", "Ostatní"], ["Jirka Ziegler", "Muž", "Ostatní", "Žádný", "Ostatní"], ["Habelová", "Žena", "Ostatní", "Žádný", "Ostatní"], ["Hospodarka", "Žena", "Ostatní", "Jídelna", "Administrativa"], ["Australopitecus", "Žena", "Černá", "Jídelna", "Kuchařka"], ["Grealish", "Žena", "Blond", "Jídelna", "Kuchařka"], ["Vykulena", "Žena", "Černá", "Jídelna", "Kuchařka"], ["Kitler", "Muž", "Ostatní", "Ict", "Ostatní"], ["Knihovnice", "Žena", "Hnědá", "Knihovna", "Ostatní"]];
const CATS=["Pohlaví","Barva vlasů","Kabinet","Povolání"];
const MAX=5;
// Sem lze později přidat fotky: jméno -> data:image/... (nebo jiná adresa obrázku)
const PHOTOS={};
const ORIG=DATA.map(r=>r[0]);
let ovr=(()=>{try{return JSON.parse(localStorage.getItem("kavadle-admin")||"null")}catch(e){return null}})()||{names:{},photos:{}};
ovr.names=ovr.names||{};ovr.photos=ovr.photos||{};
function applyOvr(){
  DATA.forEach((r,i)=>{r[0]=ovr.names[ORIG[i]]||ORIG[i]});
  for(const k in PHOTOS)delete PHOTOS[k];
  DATA.forEach((r,i)=>{const p=ovr.photos[ORIG[i]];if(p)PHOTOS[r[0]]=p});
}
let admin=!!window.ACC_ADMIN;
const SIL='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>';
applyOvr();
function photo(n,box){box.replaceChildren();if(PHOTOS[n]){const i=document.createElement("img");i.src=PHOTOS[n];i.alt=n;box.append(i)}else box.innerHTML=SIL;return box}
const $=id=>document.getElementById(id);
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
const KP=window.ACC_NAME?window.ACC_NAME+"|":"";
const ls={get(k){try{return JSON.parse(localStorage.getItem(KP+k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v))}catch(e){}}};

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const order=DATA.map((_,i)=>i);
{const r=rng(20261015);for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
const pad=v=>String(v).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const now=new Date(),dayKey=keyOf(now),yest=keyOf(new Date(now.getFullYear(),now.getMonth(),now.getDate()-1));
const dayNum=Math.floor(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/864e5);
const dailyTarget=null;
const person=n=>DATA.find(d=>d[0]===n);
let target=dailyTarget,SRV=null,busyG=false;
let mode=(window.ACCAPI&&ls.get("hadej-mode")!=="free")?"daily":"free";
let guesses=[];
const saveG=()=>mode==="daily"?0:ls.set("hadej-free",{t:target[0],g:guesses});
const origOf=n=>{const i=DATA.findIndex(r=>r[0]===n);return i<0?n:ORIG[i]};
const dispOf=o=>{const i=ORIG.indexOf(o);return i<0?o:DATA[i][0]};
const srvIn=r=>{(r.g||[]).forEach(x=>x.n=dispOf(x.n));if(r.target)r.target=dispOf(r.target);return r};
const hit=(n,i)=>mode==="daily"?!!((SRV&&SRV.g.find(x=>x.n===n)||{h:[]}).h[i]):person(n)[i+1]===target[i+1];
const isT=n=>mode==="daily"?!!(SRV&&SRV.g.some(x=>x.n===n&&x.ok)):n===target[0];
const tname=()=>mode==="daily"?((SRV&&SRV.target)||""):target[0];
function loadDaily(){target=null;SRV=null;guesses=[];update();
  ACCAPI("kvstate").then(r=>{SRV=srvIn(r);guesses=SRV.g.map(x=>x.n);update()},()=>{toast("Denní hru se nepodařilo načíst");mode="free";ls.set("hadej-mode","free");load();update()})}
function newFree(silent){
  const prev=target;let p;
  do{p=DATA[Math.floor(Math.random()*DATA.length)]}while(p===prev||p===dailyTarget);
  target=p;guesses=[];saveG();if(!silent)update();
}
function load(){
  if(mode==="daily"){loadDaily();return}
  else{const s=ls.get("hadej-free"),p=s&&person(s.t);if(p){target=p;guesses=s.g.filter(n=>person(n)).slice(0,MAX)}else newFree(true)}
}
const won=()=>mode==="daily"?!!(SRV&&SRV.won):guesses.includes(target[0]);
const lost=()=>!won()&&guesses.length>=MAX;
const over=()=>won()||lost();
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let stats=ls.get("hadej-stats")||{played:0,wins:0,total:0,streak:0,max:0,last:""};
if(stats.wins==null)stats.wins=stats.played;
let fstats=ls.get("hadej-free-stats")||{played:0,wins:0,streak:0,max:0};
const curStats=()=>mode==="daily"?stats:fstats;

/* motiv */
const th=ls.get("hadej-theme");if(th)document.documentElement.dataset.theme=th;
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme:dark)").matches}
function applyDk(){document.body.classList.toggle("dk",isDark())}
$("bTheme").onclick=()=>{const d=!isDark();document.documentElement.dataset.theme=d?"dark":"light";ls.set("hadej-theme",d?"dark":"light");applyDk()};

function toast(msg,ms=1500){const t=el("div","toast",msg);$("toast").append(t);setTimeout(()=>t.remove(),ms)}

/* kláves-ukazatele */
function renderKeys(){
  const k=$("keys");k.replaceChildren();
  CATS.forEach((c,i)=>{
    const hn=guesses.find(n=>hit(n,i));
    const d=el("div","key"+(hn?" on":""));d.append(el("b",null,c),el("span",null,hn?person(hn)[i+1]:"?"));k.append(d);
  });
}
function row(cells,cls,names){
  const r=el("div","row"+(cls?" "+cls:""));
  cells.forEach((c,i)=>{const t=el("div","t"+(c.ok?" ok":"")+(i===0?" nm":"")+(c.ph?" ph":""));
    if(i===0&&!c.ph){t.append(photo(c.v,el("span","avs")),el("span",null,c.v))}else t.textContent=c.v||"";t.style.setProperty("--i",i);if(c.l)t.setAttribute("aria-label",c.l);r.append(t)});
  return r;
}
let freshIdx=-1,shake=false;
function renderRows(){
  const box=$("rows");box.replaceChildren();
  const h=$("heads");h.replaceChildren(el("span",null,"Jméno"),...CATS.map(c=>el("span",null,c)));
  for(let g=0;g<MAX;g++){
    if(g<guesses.length){
      const n=guesses[g],p=person(n);
      const cells=[{v:n,ok:isT(n),l:"Jméno: "+n}].concat(CATS.map((c,i)=>({v:p[i+1],ok:hit(n,i),l:c+": "+p[i+1]+(hit(n,i)?" – shoda":"")})));
      let cls="";if(g===freshIdx){cls="fresh";if(isT(n))cls+=" bounce"}
      box.append(row(cells,cls));
    }else box.append(row(Array(5).fill({ph:1}),g===guesses.length&&shake?"shake":""));
  }
}
// Řazení podle příjmení (poslední slovo bez titulů); u jednoslovných jmen podle toho slova
const SURN_OVERRIDE={"Mgr. Fialová Silva":"Fialová"};
function surname(n){
  if(SURN_OVERRIDE[n])return SURN_OVERRIDE[n];
  const w=n.split(" ").filter(x=>x&&!/\.$/.test(x)&&!/^(Mgr|Ing|Bc|PhDr|RNDr|PaedDr|MA)$/i.test(x));
  return w.length?w[w.length-1]:n;
}
const cs=new Intl.Collator("cs");
const bySurname=(a,b)=>cs.compare(surname(a),surname(b))||cs.compare(a,b);
let sel=0;
function renderList(){
  const q=norm($("q").value.trim());
  const items=DATA.map(d=>d[0]).filter(n=>!guesses.includes(n)&&norm(n).includes(q)).sort(bySurname);
  const ul=$("list");ul.replaceChildren();
  if(!items.length)ul.append(el("li","empty","Nikdo nenalezen"));
  sel=Math.min(sel,Math.max(items.length-1,0));
  items.forEach((n,i)=>{const li=el("li",i===sel&&q?"sel":"",n);li.tabIndex=0;li.setAttribute("role","option");
    li.onclick=()=>guess(n);li.onkeydown=e=>{if(e.key==="Enter")guess(n)};ul.append(li)});
  $("count").textContent=over()?"":"Zbývá "+items.length+" jmen";
  ul._items=items;
}
function renderWho(){
  $("modeLbl").textContent=mode==="daily"?"Denní hra":"Neomezená hra";
  const d=over();const w=$("who");w.classList.toggle("done",d);
  photo(d?tname():"",$("whoPh"));
  $("whoCap").textContent=d?tname():(mode==="daily"&&!SRV?"Načítám…":"Kdo je to?");
  const dots=$("dots");dots.replaceChildren();
  for(let i=0;i<MAX;i++)dots.append(el("i",i<MAX-guesses.length?"on":""));
  dots.setAttribute("aria-label","Zbývá pokusů: "+(MAX-guesses.length));
}
function update(){
  renderWho();renderKeys();renderRows();renderList();
  const d=over();$("picker").classList.toggle("hidden",d);$("again").classList.toggle("hidden",!d);$("bNew").classList.toggle("hidden",mode!=="free");
}
function guess(n){
  if(over()||guesses.includes(n)||busyG)return;
  if(mode==="daily"){
    if(!SRV)return;busyG=true;
    ACCAPI("kvguess",{name:origOf(n)}).then(r=>{busyG=false;SRV=srvIn(r);guesses=SRV.g.map(x=>x.n);$("q").value="";sel=0;freshIdx=guesses.length-1;update();freshIdx=-1;
      if(SRV.won&&SRV.gain)setTimeout(()=>toast("+"+SRV.gain+" 🪙  +"+SRV.xpgain+" XP",2800),2000);
      afterGuess()},e=>{busyG=false;toast(/maintenance/.test(String(e))?"Probíhá údržba":"Tip se nepodařilo odeslat")});
    return}
  guesses.push(n);saveG();$("q").value="";sel=0;freshIdx=guesses.length-1;update();freshIdx=-1;
  afterGuess()}
function afterGuess(){
  if(over()){
    const w=won();
    if(mode==="free"){fstats.played++;if(w){fstats.wins++;fstats.streak++;fstats.max=Math.max(fstats.max,fstats.streak)}else fstats.streak=0;ls.set("hadej-free-stats",fstats)}
    else if(stats.last!==dayKey){
      stats.played++;
      if(w){stats.wins++;stats.total+=guesses.length;stats.streak=stats.last===yest?stats.streak+1:1;stats.max=Math.max(stats.max,stats.streak)}
      else stats.streak=0;
      stats.last=dayKey;ls.set("hadej-stats",stats);
    }
    const m=w?["Geniální!","Skvělé!","Výborně!","Dobrá práce!","Uf, těsně!"][guesses.length-1]:"Hledaná osoba: "+tname();
    setTimeout(()=>toast(m,w?1800:2600),1300);
    setTimeout(()=>openStats(),w?3000:3600);
  }
}
$("q").addEventListener("input",()=>{sel=0;renderList()});
$("q").addEventListener("keydown",e=>{
  const items=$("list")._items||[];
  if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(sel+1,items.length-1);renderList()}
  else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(sel-1,0);renderList()}
  else if(e.key==="Enter"){
    if(items[sel]&&$("q").value.trim())guess(items[sel]);
    else{toast("Vyber jméno ze seznamu");shake=true;renderRows();shake=false}
  }
});

/* modaly */
function open(fn){$("mbody").replaceChildren();fn($("mbody"));$("ov").classList.remove("hidden");$("bClose").focus()}
function close(){$("ov").classList.add("hidden")}
$("bClose").onclick=close;$("ov").onclick=e=>{if(e.target===$("ov"))close()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("bHelp").onclick=()=>open(b=>{
  b.append(el("h2",null,"Jak hrát"));
  b.append(el("p",null,"Hádej, kdo je dnešní osoba. Máš 5 pokusů. Vyber jméno ze seznamu a ke každému tipu se ukážou čtyři údaje: pohlaví, barva vlasů, kabinet a povolání."));
  b.append(el("p",null,"Údaj, který se shoduje s hledanou osobou, zezelená a rozsvítí se i nahoře. Ostatní zůstanou bílé."));
  b.append(el("h3",null,"Příklad"));
  const ex=el("div","ex");
  [["Mgr. Jan Příklad",0],["Muž",1],["Hnědá",0],["Ict",1],["Učitel",0]].forEach(([v,ok],i)=>{const t=el("div","t"+(ok?" ok":""),v);ex.append(t)});
  b.append(ex,el("p",null,"Pohlaví a kabinet sedí s hledanou osobou, barva vlasů a povolání ne."));
  b.append(el("p",null,"Hledaná osoba se mění každý den o půlnoci. Za uhodnutí denní osoby dostaneš 30 coinů a 50 XP, jednou denně. Kolečka pod seznamem ukazují, kolik pokusů ti zbývá. V menu najdeš i neomezenou hru, kde můžeš hrát bez limitu."));
});
function share(){
  const lines=guesses.map(n=>{return CATS.map((_,i)=>hit(n,i)?"🟩":"⬜").join("")});
  const txt="Kavadle "+(mode==="daily"?dayKey:"(neomezená hra)")+" – "+(won()?guesses.length:"X")+"/"+MAX+"\n\n"+lines.join("\n");
  const ok=()=>toast("Zkopírováno do schránky");
  try{navigator.clipboard.writeText(txt).then(ok,()=>prompt("Zkopíruj výsledek:",txt))}catch(e){prompt("Zkopíruj výsledek:",txt)}
}
let clk=null;
function openStats(){open(b=>{
  b.append(el("h2",null,"Statistiky · "+(mode==="daily"?"denní hra":"neomezená hra")));
  const s=el("div","stats");
  ((S)=>[[S.played,"Odehráno"],[S.played?Math.round(S.wins/S.played*100):0,"% výher"],[S.streak,"Série"],[S.max,"Nejdelší série"]])(curStats()).forEach(([v,l])=>{const d=el("div");d.append(el("b",null,v),el("span",null,l));s.append(d)});
  b.append(s);
  if(over()){
    const pre=mode==="daily"?"Dnes":"Tato hra";
    b.append(el("p",null,won()?pre+": "+tname()+" na "+guesses.length+". pokus.":pre+" se nepovedlo. Hledaná osoba byla: "+tname()+"."));
    if(mode==="daily"&&SRV&&SRV.won&&SRV.gain)b.append(el("p",null,"Odměna: +"+SRV.gain+" 🪙 · +"+SRV.xpgain+" XP (jednou denně)"));
    const f=el("div","fin");
    if(mode==="daily"){const a=el("div");a.append(el("h3",null,"Další osoba za"));clk=el("div","clock");a.append(clk);f.append(a)}
    else{const nb=el("button","btn","Nová hra");nb.onclick=()=>{close();newFree()};f.append(nb)}
    const sb=el("button","btn","Sdílet");sb.onclick=share;f.append(sb);b.append(f);
    if(mode==="daily")tick();
  }
})}
$("bMenu").onclick=()=>open(b=>{
  b.append(el("h2",null,"Menu"));
  [["daily","Denní hra","Jedna osoba denně · uhodneš = 30 🪙 + 50 XP (1× denně)."],["free","Neomezená hra","Hraj kolikrát chceš, bez odměn. Po každé hře přijde nová osoba."]].forEach(([m,tt,d])=>{
    const o=el("button","opt"+(mode===m?" on":""));o.append(el("b",null,tt),el("span",null,d));
    o.onclick=()=>{if(m==="daily"&&!window.ACCAPI){toast("Denní hra funguje jen po přihlášení do hry");return}if(m!==mode){mode=m;ls.set("hadej-mode",m);load();update()}close()};b.append(o);
  });
  if(admin)b.append(el("h3",null,"Admin"));
  const items=admin?[["Editace osob","Změna jmen a přidání fotek",openEditor],["Export a import","Záloha a přenos úprav",openPorter]]
    :[];
  items.forEach(([tt,d,fn])=>{const o=el("button","opt");o.append(el("b",null,tt));if(d)o.append(el("span",null,d));o.onclick=fn;b.append(o)});
});
$("bNew").onclick=()=>newFree();
$("bStats").onclick=openStats;$("bShow").onclick=openStats;
function tick(){
  if(!clk||!clk.isConnected)return;
  const m=new Date(),n=new Date(m.getFullYear(),m.getMonth(),m.getDate()+1);
  const s=Math.max(0,Math.floor((n-m)/1000));
  clk.textContent=pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);
  if(s===0)location.reload();else setTimeout(tick,1000);
}

function toPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const S=160,c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d");const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);res(c.toDataURL("image/jpeg",.82))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function commit(next){
  try{localStorage.setItem("kavadle-admin",JSON.stringify(next))}catch(e){toast("Uložení se nepovedlo (málo místa)");return false}
  const old=DATA.map(r=>r[0]);
  ovr=next;ovr.names=ovr.names||{};ovr.photos=ovr.photos||{};applyOvr();
  const map={};old.forEach((o,i)=>map[o]=DATA[i][0]);
  const s1=ls.get("hadej-ucitele");if(s1&&s1.g)ls.set("hadej-ucitele",{day:s1.day,g:s1.g.map(n=>map[n]||n)});
  const s2=ls.get("hadej-free");if(s2)ls.set("hadej-free",{t:map[s2.t]||s2.t,g:(s2.g||[]).map(n=>map[n]||n)});
  guesses=guesses.map(n=>map[n]||n);saveG();update();
  return true;
}
function openLogin(){open(b=>{
  b.append(el("h2",null,"Přihlášení admina"));
  const u=el("input");u.placeholder="Uživatelské jméno";u.autocomplete="username";u.setAttribute("aria-label","Uživatelské jméno");
  const p=el("input");p.type="password";p.placeholder="Heslo";p.autocomplete="current-password";p.setAttribute("aria-label","Heslo");
  const err=el("p","err","");
  const go=()=>{
    if(false){admin=true;try{sessionStorage.setItem("kavadle-admin","1")}catch(e){}toast("Přihlášeno");openEditor()}
    else err.textContent="Nesprávné jméno nebo heslo."
  };
  [u,p].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")go()}));
  const l1=el("label","lbl","Uživatelské jméno"),l2=el("label","lbl","Heslo");
  const bt=el("button","btn","Přihlásit");bt.onclick=go;bt.style.width="100%";bt.style.marginTop="8px";
  b.append(l1,u,l2,p,err,bt);setTimeout(()=>u.focus(),0);
})}
function openEditor(){
  if(!admin)return openLogin();
  open(b=>{
    b.append(el("h2",null,"Editace osob"));
    b.append(el("p",null,"Klikni na kruh a nahraj fotku, nebo přepiš jméno. Úpravy se ukládají v tomto prohlížeči."));
    const work=DATA.map((r,i)=>({i,name:r[0],photo:PHOTOS[r[0]]||""}));
    const list=el("div");
    work.slice().sort((a,c)=>bySurname(a.name,c.name)).forEach(w=>{
      const row=el("div","edrow");
      const ph=el("button","edph");ph.type="button";ph.setAttribute("aria-label","Nahrát fotku");
      const rm=el("button","edrm","×");rm.type="button";rm.setAttribute("aria-label","Odebrat fotku");
      const fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.className="hidden";
      const draw=()=>{if(w.photo){const im=document.createElement("img");im.src=w.photo;im.alt="";ph.replaceChildren(im)}else ph.innerHTML=SIL;rm.classList.toggle("hidden",!w.photo)};
      ph.onclick=()=>fi.click();
      fi.onchange=async()=>{const f=fi.files[0];if(!f)return;try{w.photo=await toPhoto(f);draw()}catch(e){toast("Obrázek se nepodařilo načíst")}};
      rm.onclick=()=>{w.photo="";draw()};
      const nm=el("input","edin");nm.value=w.name;nm.setAttribute("aria-label","Jméno");nm.oninput=()=>{w.name=nm.value};
      draw();row.append(ph,nm,rm,fi);list.append(row);
    });
    b.append(list);
    const sv=el("button","btn","Uložit změny");sv.style.width="100%";sv.style.marginTop="16px";
    sv.onclick=()=>{
      const names=work.map(w=>w.name.trim());
      if(names.some(n=>!n)){toast("Jméno nesmí být prázdné");return}
      if(new Set(names).size!==names.length){toast("Některá jména se opakují");return}
      const nn={},pp={};
      work.forEach((w,k)=>{const o=ORIG[w.i];if(names[k]!==o)nn[o]=names[k];if(w.photo)pp[o]=w.photo});
      if(commit({names:nn,photos:pp})){close();toast("Uloženo")}
    };
    b.append(sv);
  });
}
function openPorter(){open(b=>{
  b.append(el("h2",null,"Export a import"));
  b.append(el("p",null,"Export obsahuje všechna upravená jména a fotky. Zkopíruj ho a ulož, nebo vlož na jiném zařízení."));
  const ta=el("textarea");ta.value=JSON.stringify(ovr);ta.setAttribute("aria-label","Data úprav");
  const cp=el("button","btn","Kopírovat");cp.style.marginTop="8px";
  cp.onclick=()=>{try{navigator.clipboard.writeText(ta.value).then(()=>toast("Zkopírováno"),()=>{ta.select()})}catch(e){ta.select()}};
  const im=el("button","btn","Importovat");im.style.margin="8px 0 0 8px";
  im.onclick=()=>{
    try{const o=JSON.parse(ta.value);if(!o||typeof o!=="object"||typeof(o.names||{})!=="object"||typeof(o.photos||{})!=="object")throw 0;
      if(commit({names:o.names||{},photos:o.photos||{}})){close();toast("Importováno")}}
    catch(e){toast("Data nejsou platná")}
  };
  b.append(ta,cp,im);
})}
applyDk();load();update();
</script>
